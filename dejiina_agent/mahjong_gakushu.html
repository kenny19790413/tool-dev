<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀ゼロから道場</title>
<style>
  html{font-size:18px;}
  :root{
    --felt:#0b5d3b;
    --felt-dark:#073d27;
    --gold:#e6b800;
    --tile-bg:#fdfaf1;
    --tile-border:#d8cfa8;
    --tile-frame:#1c5c39;
    --tile-frame-dark:#0d3320;
    --ink:#222;
    --red:#c0392b;
    --blue:#1f4e9c;
    --green2:#1e7a3c;
    --danger:#e74c3c;
    --ok:#2ecc71;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:radial-gradient(circle at top, var(--felt) 0%, var(--felt-dark) 100%);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
  }
  .wrap{width:100%;max-width:720px;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{font-size:1.3rem;margin:0;letter-spacing:1px;}
  .level-badge{
    background:linear-gradient(135deg,var(--gold),#fff3c4);
    color:#5a4200;
    padding:6px 14px;
    border-radius:20px;
    font-weight:bold;
    font-size:0.85rem;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
    white-space:nowrap;
  }
  .card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
    backdrop-filter:blur(2px);
  }
  .stage-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:480px){ .stage-grid{grid-template-columns:1fr;} }
  .stage-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:12px;
    padding:14px;
    color:#fff;
    text-align:left;
    cursor:pointer;
    transition:.15s;
  }
  .stage-btn:hover{background:rgba(255,255,255,0.18); transform:translateY(-2px);}
  .stage-btn .num{
    display:inline-block;
    width:26px;height:26px;line-height:26px;
    text-align:center;
    background:var(--gold);
    color:#3a2c00;
    border-radius:50%;
    font-weight:bold;
    margin-right:8px;
    font-size:.85rem;
  }
  .stage-btn .title{font-weight:bold;font-size:1rem;}
  .stage-btn .master-badge{font-size:.9rem;margin-left:2px;}
  .stage-btn .desc{font-size:.78rem;opacity:.8;margin-top:4px;}
  .locked{opacity:.4; cursor:not-allowed;}
  .locked:hover{transform:none;background:rgba(255,255,255,0.08);}

  .level-progress-wrap{margin-top:10px;}
  .level-progressbar{
    width:100%;height:8px;background:rgba(255,255,255,0.15);
    border-radius:4px;overflow:hidden;
  }
  .level-progressbar-fill{height:100%;background:var(--gold);transition:width .3s;}

  .progressbar{
    width:100%;height:8px;background:rgba(255,255,255,0.15);
    border-radius:4px;overflow:hidden;margin-bottom:16px;
  }
  .progressbar-fill{height:100%;background:var(--gold);transition:width .3s;}

  .tiles-row{
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
    margin:24px 0;
  }
  .tile{
    position:relative;
    width:64px;height:86px;
    padding:4px;
    background:var(--tile-frame);
    border-radius:12px;
    box-shadow:0 3px 0 var(--tile-frame-dark), 0 5px 9px rgba(0,0,0,.4);
    user-select:none;
  }
  .tile.small{width:46px;height:62px;padding:3px;}
  .tile-face{
    position:relative;
    width:100%;height:100%;
    background:var(--tile-bg);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;font-weight:bold;
    color:var(--ink);
  }
  .tile.small .tile-face{font-size:1.1rem;}
  .tile-img{width:82%;height:82%;object-fit:contain;pointer-events:none;}
  ruby{ruby-position:over;}
  rt{font-size:.55em;opacity:.75;user-select:none;}

  .question-text{
    text-align:center;
    font-size:1.15rem;
    font-weight:bold;
    margin-bottom:8px;
  }
  .sub-text{
    text-align:center;
    font-size:.85rem;
    opacity:.75;
    margin-bottom:8px;
  }
  .choices{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin-top:20px;
  }
  @media (max-width:480px){ .choices{grid-template-columns:1fr;} }
  .choice-btn{
    background:#fff;
    color:#222;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:.12s;
    box-shadow:0 3px 0 #b8b8b8;
  }
  .choice-btn:hover:not(:disabled){background:#fff8dd;}
  .choice-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #b8b8b8;}
  .choice-btn.correct{background:var(--ok)!important;color:#fff;box-shadow:0 3px 0 #1c9c53;}
  .choice-btn.wrong{background:var(--danger)!important;color:#fff;box-shadow:0 3px 0 #a83226;}
  .choice-btn.missed{background:#f5d97a!important;color:#3a2c00;box-shadow:0 3px 0 #c9a244;}
  .tile-choice-btn{background:none;border:none;padding:3px;cursor:pointer;border-radius:14px;transition:.15s;}
  .tile-choice-btn:hover:not(:disabled){transform:translateY(-5px);}
  .tile-choice-btn:disabled{cursor:default;}
  .tile-choice-btn.correct{box-shadow:0 0 0 3px var(--ok);background:rgba(46,204,113,.15);}
  .tile-choice-btn.wrong{box-shadow:0 0 0 3px var(--danger);background:rgba(231,76,60,.15);}
  .tile-choice-btn.dim{opacity:.35;}
  .choice-btn.multi.selected{box-shadow:0 0 0 3px var(--gold) inset, 0 3px 0 #b8b8b8;background:#fff8dd;}
  .choice-btn:disabled{cursor:default;}
  .hand-row{row-gap:10px;}
  .hand-group{display:inline-flex;flex-wrap:wrap;gap:2px;margin:0 8px 8px 0;max-width:100%;}
  .quiz-topbar{display:flex;justify-content:flex-end;margin-bottom:4px;}
  .quit-btn{
    background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:14px;padding:8px 14px;font-size:.75rem;cursor:pointer;opacity:.8;
    min-height:36px;
  }
  .quit-btn:hover{opacity:1;background:rgba(255,255,255,.1);}
  .quit-btn.armed{background:var(--danger);border-color:var(--danger);color:#fff;opacity:1;font-weight:bold;}
  .name-input{
    width:100%;padding:12px;border-radius:10px;border:none;font-size:1rem;
    margin-top:12px;background:var(--tile-bg);color:var(--ink);box-sizing:border-box;
  }
  .name-input:focus{outline:2px solid var(--gold);}
  .name-err{color:#ff9d9d;font-size:.8rem;text-align:center;margin-top:6px;min-height:1em;}
  .user-chip{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:14px;padding:6px 12px;font-size:.75rem;cursor:pointer;display:none;
  }
  .user-chip:hover{background:rgba(255,255,255,.22);}
  .refresh-chip{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:14px;padding:6px 10px;font-size:.85rem;cursor:pointer;line-height:1;
  }
  .refresh-chip:hover{background:rgba(255,255,255,.22);}
  .refresh-chip:active{transform:scale(.92);}
  .user-pick-btn{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:10px;
    padding:10px;color:#fff;cursor:pointer;text-align:left;font-size:.85rem;
  }
  .user-pick-btn:hover{background:rgba(255,255,255,.18);}
  .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .yaku-list{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .yaku-row{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 12px;}
  .yaku-row-head{display:flex;align-items:center;gap:8px;font-size:.95rem;}
  .yaku-han-chip{background:var(--gold);color:#3a2c00;font-size:.7rem;font-weight:bold;padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .yaku-han-chip.yakuman{background:var(--danger);color:#fff;}
  .yaku-row-desc{font-size:.78rem;opacity:.8;margin-top:4px;}
  .example-tiles{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px;}
  .example-hand{justify-content:flex-start;margin:0;}
  .dora-line{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:.8rem;opacity:.85;}
  .yaku-row.not-quizzed{opacity:.6;}
  .not-quizzed-badge{
    font-size:.65rem;border:1px solid rgba(255,255,255,.4);border-radius:8px;
    padding:1px 6px;opacity:.85;white-space:nowrap;
  }
  .fu-rule-list{margin:12px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;font-size:.85rem;line-height:1.4;}
  .link-btn{
    background:none;border:none;color:var(--gold);text-decoration:underline;
    font-size:.82rem;cursor:pointer;padding:0;
  }

  .feedback{
    text-align:center;
    margin-top:14px;
    font-weight:bold;
    min-height:22px;
    font-size:.95rem;
  }
  .feedback.ok{color:#7bffb0;}
  .feedback.ng{color:#ff9d9d;}

  .btn-row{display:flex;justify-content:center;gap:10px;margin-top:18px;}
  body.has-next-bar{padding-bottom:70px;}
  .next-fixed-bar{
    position:fixed;
    right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:50;
  }
  .next-fixed-bar .btn{
    font-size:.85rem;
    padding:10px 18px;
    border-radius:22px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
  }
  .btn{
    background:var(--gold);
    color:#3a2c00;
    border:none;
    padding:10px 22px;
    border-radius:20px;
    font-weight:bold;
    cursor:pointer;
    font-size:.9rem;
  }
  .btn.ghost{
    background:transparent;
    color:#fff;
    border:1px solid rgba(255,255,255,.4);
  }
  .stat-row{
    display:flex;justify-content:space-around;
    text-align:center;margin:10px 0 4px;
  }
  .stat-row div{font-size:.8rem;opacity:.8;}
  .stat-row b{display:block;font-size:1.3rem;color:var(--gold);}
  .result-title{text-align:center;font-size:1.4rem;margin-bottom:4px;}
  .result-sub{text-align:center;opacity:.8;font-size:.9rem;margin-bottom:16px;}
  .levelup-banner{
    text-align:center;background:linear-gradient(135deg,#fff3c4,#ffd452);
    color:#5a4200;border-radius:12px;padding:12px;margin:14px 0;
    font-weight:bold;
    animation:pop .4s ease;
  }
  @keyframes pop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
  .hint{font-size:.75rem;opacity:.65;text-align:center;margin-top:10px;}
  .wait-note{font-size:1rem;opacity:.9;text-align:center;margin-top:12px;line-height:1.6;font-weight:bold;}
  footer{opacity:.5;font-size:.7rem;margin-top:10px;text-align:center;}

  /* ===== 点数計算機 ===== */
  .picker-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:8px;}
  @media (max-width:480px){ .picker-grid{grid-template-columns:repeat(7,1fr);} }
  .picker-tile{background:none;border:none;padding:2px;cursor:pointer;border-radius:8px;transition:.1s;}
  .picker-tile:hover{background:rgba(255,255,255,.15);}
  .picker-tile .tile{width:32px;height:44px;}
  .tile-btn{background:none;border:none;padding:0;cursor:pointer;position:relative;}
  .tile-btn .remove-x{
    position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
    background:var(--danger);color:#fff;font-size:.7rem;line-height:18px;text-align:center;
  }
  .count-badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:.85rem;font-weight:bold;background:rgba(255,255,255,.1);}
  .count-badge.ready{background:var(--ok);color:#063;}
  .count-badge.over{background:var(--danger);}
  .toggle-group{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .toggle-btn{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);color:#fff;
    padding:8px 14px;border-radius:16px;font-size:.82rem;cursor:pointer;
  }
  .toggle-btn.active{background:var(--gold);color:#3a2c00;border-color:var(--gold);font-weight:bold;}
  .calc-select{
    padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.3);
    background:#0d3320;color:#fff;font-size:.85rem;
  }
  .score-big{font-size:1.4rem;font-weight:bold;color:var(--gold);margin:10px 0;text-align:center;}
  .yaku-chip{
    display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
    border-radius:12px;padding:4px 10px;font-size:.8rem;margin:3px;
  }
  .fu-list{font-size:.75rem;opacity:.75;text-align:left;max-width:420px;margin:10px auto;line-height:1.7;}
  .error-box{background:rgba(231,76,60,.15);border:1px solid var(--danger);border-radius:10px;padding:12px;font-size:.85rem;text-align:center;}
  .section-label{font-size:.85rem;font-weight:bold;margin:14px 0 6px;opacity:.85;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🀄 麻雀ゼロから道場</h1>
    <div class="header-right">
      <button class="refresh-chip" id="refreshChipBtn" title="最新版を確認">🔄</button>
      <button class="user-chip" id="userChipBtn"></button>
      <div class="level-badge" id="levelBadge">Lv.1 牌の見習い</div>
    </div>
  </header>

  <div id="app"></div>
  <footer>ランダム出題・レベル判定つき麻雀入門トレーニング</footer>
</div>

<script>
/* ==================== 最新版の自動確認 ==================== */
// URLにキャッシュ回避用のクエリが無ければ、一度だけ強制的に読み込み直して最新版を取得する。
// localStorage（ニックネームごとの経験値・進捗）はクエリ文字列に関係なく同一オリジンで保持されるため、
// この更新処理で経験値が消えることはない。
function forceRefresh(){
  try{
    const url = new URL(location.href);
    url.searchParams.set("_v", Date.now().toString());
    location.replace(url.toString());
  }catch(e){
    location.reload();
  }
}
(function(){
  try{
    const url = new URL(location.href);
    if(!url.searchParams.has("_v")) forceRefresh();
  }catch(e){}
})();

/* ==================== データ定義 ==================== */
// 34種の牌: 萬子(m)1-9, 筒子(p)1-9, 索子(s)1-9, 字牌(z)1-7
const SUIT_NAME = {m:"萬子", p:"筒子", s:"索子", z:"字牌"};
const Z_LABEL = {1:"東",2:"南",3:"西",4:"北",5:"白",6:"發",7:"中"};
const Z_YOMI  = {1:"とん",2:"なん",3:"しゃー",4:"ぺー",5:"はく",6:"はつ",7:"ちゅん"};
const KANSUJI = {1:"一",2:"二",3:"三",4:"四",5:"五",6:"六",7:"七",8:"八",9:"九"};

function allTiles(){
  const arr=[];
  ["m","p","s"].forEach(suit=>{
    for(let r=1;r<=9;r++) arr.push({suit, rank:r});
  });
  for(let r=1;r<=7;r++) arr.push({suit:"z", rank:r});
  return arr;
}
const TILES = allTiles();

function tileEqual(a,b){ return a.suit===b.suit && a.rank===b.rank; }

function tileLabel(t){
  if(t.suit==="z") return Z_LABEL[t.rank];
  return KANSUJI[t.rank];
}
function tileSuitMark(t){
  if(t.suit==="m") return "萬";
  if(t.suit==="p") return "筒";
  if(t.suit==="s") return "索";
  return "";
}
function tileFullName(t){
  if(t.suit==="z") return Z_LABEL[t.rank] + "(" + Z_YOMI[t.rank] + ")";
  return KANSUJI[t.rank] + SUIT_NAME[t.suit] + "（" + t.rank + t.suit + "）";
}

// 牌の絵柄はフリー素材（CC0 / public domain, FluffyStuff/riichi-mahjong-tiles）の実物イラストを使用
const TILE_FILE = {
  m:{1:"Man1.svg",2:"Man2.svg",3:"Man3.svg",4:"Man4.svg",5:"Man5.svg",6:"Man6.svg",7:"Man7.svg",8:"Man8.svg",9:"Man9.svg"},
  p:{1:"Pin1.svg",2:"Pin2.svg",3:"Pin3.svg",4:"Pin4.svg",5:"Pin5.svg",6:"Pin6.svg",7:"Pin7.svg",8:"Pin8.svg",9:"Pin9.svg"},
  s:{1:"Sou1.svg",2:"Sou2.svg",3:"Sou3.svg",4:"Sou4.svg",5:"Sou5.svg",6:"Sou6.svg",7:"Sou7.svg",8:"Sou8.svg",9:"Sou9.svg"},
  z:{1:"Ton.svg",2:"Nan.svg",3:"Shaa.svg",4:"Pei.svg",5:"Haku.svg",6:"Hatsu.svg",7:"Chun.svg"},
};
function renderTile(t, size=""){
  const cls = "tile " + t.suit + (size?" "+size:"");
  const file = TILE_FILE[t.suit][t.rank];
  return `<div class="${cls}"><div class="tile-face"><img class="tile-img" src="tiles/${file}" alt="${tileFullName(t)}" draggable="false"></div></div>`;
}

// ふりがな（読めなくても選べるが、用語を覚える助けとして併記）
function rb(kanji, reading){ return `<ruby>${kanji}<rt>${reading}</rt></ruby>`; }
const RUBY_MAP = {
  "順子": rb("順子","しゅんつ"),
  "刻子": rb("刻子","コーツ"),
  "対子": rb("対子","トイツ"),
  "バラバラ（面子にならない）": `バラバラ（${rb("面子","メンツ")}にならない）`,
  "タンヤオ（2〜8の数牌だけ）": "タンヤオ（2〜8の数牌だけ）",
  "役牌（中/發/白のいずれかの刻子）": `${rb("役牌","やくはい")}（中/發/白のいずれかの${rb("刻子","コーツ")}）`,
  "混一色（ホンイツ：1種類の数牌＋字牌）": `${rb("混一色","ホンイツ")}（1種類の数牌＋${rb("字牌","じはい")}）`,
  "清一色（チンイツ：1種類の数牌だけ）": `${rb("清一色","チンイツ")}（1種類の数牌だけ）`,
  "七対子（同じ牌のペアを7組そろえる役）": `${rb("七対子","チートイツ")}（同じ牌のペアを7組そろえる役）`,
  "タンヤオ": "タンヤオ",
  "立直": rb("立直","リーチ"),
  "対々和": rb("対々和","トイトイ"),
  "一盃口": rb("一盃口","イーペーコー"),
  "混一色": rb("混一色","ホンイツ"),
  "清一色": rb("清一色","チンイツ"),
  "混老頭": rb("混老頭","ホンロウトウ"),
  "混全帯幺九（チャンタ）": rb("混全帯幺九","チャンタ"),
  "七対子": rb("七対子","チートイツ"),
  "役なし": "役なし",
  "役牌（東）": `${rb("役牌","やくはい")}（東）`,
  "役牌（南）": `${rb("役牌","やくはい")}（南）`,
  "役牌（西）": `${rb("役牌","やくはい")}（西）`,
  "役牌（北）": `${rb("役牌","やくはい")}（北）`,
  "役牌（白）": `${rb("役牌","やくはい")}（白）`,
  "役牌（發）": `${rb("役牌","やくはい")}（發）`,
  "役牌（中）": `${rb("役牌","やくはい")}（中）`,
  "国士無双【役満】": `${rb("国士無双","こくしむそう")}【役満】`,
  "大三元【役満】": `${rb("大三元","だいさんげん")}【役満】`,
  "小四喜【役満】": `${rb("小四喜","しょうすーしー")}【役満】`,
  "大四喜【役満】": `${rb("大四喜","だいすーしー")}【役満】`,
  "字一色【役満】": `${rb("字一色","つーいーそー")}【役満】`,
  "清老頭【役満】": `${rb("清老頭","ちんろうとう")}【役満】`,
  "緑一色【役満】": `${rb("緑一色","りゅーいーそー")}【役満】`,
};
// 牌の名前（例:「二萬子」）にもマンズ/ピンズ/ソーズのふりがなを自動で追加する
const SUIT_READING = {m:"マンズ", p:"ピンズ", s:"ソーズ"};
TILES.forEach(t=>{
  if(t.suit==="z") return;
  const plain = tileFullName(t).split("（")[0];
  const suitKanji = SUIT_NAME[t.suit];
  RUBY_MAP[plain] = plain.replace(suitKanji, rb(suitKanji, SUIT_READING[t.suit]));
});
function displayHtml(choice){ return RUBY_MAP[choice] || choice; }

function randTile(){ return {...TILES[Math.floor(Math.random()*TILES.length)]}; }
function randSuitedTile(){ // 数牌のみ(順子生成用)
  const suits=["m","p","s"];
  const suit=suits[Math.floor(Math.random()*3)];
  const rank=1+Math.floor(Math.random()*9);
  return {suit,rank};
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickN(arr,n){ return shuffle(arr).slice(0,n); }

function pushHistory(stage,key){
  const h=recentHistory[stage];
  h.push(key);
  if(h.length>8) h.shift();
}
function isRecent(stage,key){ return recentHistory[stage].includes(key); }

function freshProgress(){
  const stageStats={};
  for(let i=1;i<=9;i++) stageStats[i]={c:0,t:0};
  return {xp:0, correct:0, total:0, stageStats, missed:[], tutorialSeen:false, recentResults:[]};
}
function normalizeProgress(p){
  if(!p) return freshProgress();
  if(typeof p.xp!=="number") p.xp=0;
  if(typeof p.correct!=="number") p.correct=0;
  if(typeof p.total!=="number") p.total=0;
  if(!p.stageStats) p.stageStats={};
  for(let i=1;i<=9;i++){ if(!p.stageStats[i]) p.stageStats[i]={c:0,t:0}; }
  if(!Array.isArray(p.missed)) p.missed=[];
  if(typeof p.tutorialSeen!=="boolean"){
    p.tutorialSeen = (p.xp>0 || p.total>0); // 既に活動している人には初回チュートリアルを出さない
  }
  if(!Array.isArray(p.recentResults)) p.recentResults=[];
  return p;
}
const RECENT_WINDOW = 20; // 「直近の正答率」の集計対象問題数
function pushRecent(isCorrect){
  if(!progress.recentResults) progress.recentResults=[];
  progress.recentResults.push(isCorrect);
  if(progress.recentResults.length>RECENT_WINDOW) progress.recentResults.shift();
}
function recentAccuracy(){
  const arr = progress.recentResults||[];
  if(arr.length===0) return null;
  return Math.round(arr.filter(Boolean).length/arr.length*100);
}

/* ==================== 問題生成: ステージ1 牌の名前 ==================== */
function genQ1(){
  let t, key;
  do{
    t = randTile();
    key = t.suit+t.rank;
  }while(isRecent(1,key));
  pushHistory(1,key);

  const correct = tileFullName(t).split("（")[0]; // 表示名だけ
  // 誤答: 同じsuitの別rank優先で紛らわしく
  const distractorsPool = TILES.filter(x=>!tileEqual(x,t));
  const sameSuit = distractorsPool.filter(x=>x.suit===t.suit);
  const others = distractorsPool.filter(x=>x.suit!==t.suit);
  const picks = pickN(sameSuit, Math.min(2,sameSuit.length)).concat(pickN(others,3));
  const wrongNames = pickN(picks,3).map(x=>tileFullName(x).split("（")[0]);
  const choices = shuffle([correct, ...wrongNames]);

  return {
    stage:1,
    question:"この牌の名前は？",
    render: `<div class="tiles-row">${renderTile(t)}</div>`,
    choices,
    answer: correct,
  };
}

/* ==================== 問題生成: ステージ2 面子判定 ==================== */
function genMentsuGroup(){
  // typeを決めてから牌を生成
  const roll = Math.random();
  if(roll<0.28){
    // 順子
    const t=randSuitedTile();
    const maxStart = Math.min(t.rank,7);
    const start = Math.max(1, Math.min(t.rank, 7));
    const s = 1+Math.floor(Math.random()*7);
    const tiles=[{suit:t.suit,rank:s},{suit:t.suit,rank:s+1},{suit:t.suit,rank:s+2}];
    return {tiles, type:"順子"};
  } else if(roll<0.56){
    // 刻子
    const t=randTile();
    return {tiles:[{...t},{...t},{...t}], type:"刻子"};
  } else if(roll<0.78){
    // 対子(2枚)
    const t=randTile();
    return {tiles:[{...t},{...t}], type:"対子"};
  } else {
    // バラバラ
    let tiles;
    let tries=0;
    do{
      tiles = [randTile(), randTile(), randTile()];
      tries++;
    }while(tries<10 && isValidSet(tiles));
    return {tiles, type:"バラバラ"};
  }
}
function isValidSet(tiles){
  // 順子や刻子になってしまっていないかの簡易チェック
  if(tiles[0].suit===tiles[1].suit && tiles[1].suit===tiles[2].suit){
    const ranks = tiles.map(t=>t.rank).sort((a,b)=>a-b);
    if(ranks[0]===ranks[1] && ranks[1]===ranks[2]) return true;
    if(tiles[0].suit!=="z" && ranks[1]-ranks[0]===1 && ranks[2]-ranks[1]===1) return true;
  }
  return false;
}
function genQ2(){
  let g, key;
  do{
    g = genMentsuGroup();
    key = g.type + g.tiles.map(t=>t.suit+t.rank).join(",");
  }while(isRecent(2,key));
  pushHistory(2,key);

  const choices = shuffle(["順子","刻子","対子","バラバラ（面子にならない）"]);
  const answer = g.type==="バラバラ" ? "バラバラ（面子にならない）" : g.type;

  return {
    stage:2,
    question:"この組み合わせは何？",
    render: `<div class="tiles-row">${g.tiles.map(t=>renderTile(t)).join("")}</div>`,
    choices,
    answer,
  };
}

// フリテン判定のミニ出題：待ちの形＋捨て牌を見せて「今ロンできるか」を答えさせる
function genFuritenCheck(){
  let payload, key;
  do{
    const suit = ["m","p","s"][Math.floor(Math.random()*3)];
    const isKanchan = Math.random()<0.35;
    if(isKanchan){
      const r1 = 1+Math.floor(Math.random()*7);
      payload = {shown:[{suit,rank:r1},{suit,rank:r1+2}], waits:[{suit,rank:r1+1}]};
    } else {
      const r1 = 1+Math.floor(Math.random()*8);
      const waits=[];
      if(r1-1>=1) waits.push({suit,rank:r1-1});
      if(r1+2<=9) waits.push({suit,rank:r1+2});
      payload = {shown:[{suit,rank:r1},{suit,rank:r1+1}], waits};
    }
    key = "furiten|"+payload.shown.map(t=>t.suit+t.rank).join(",");
  }while(isRecent(3,key));
  pushHistory(3,key);

  const waits = payload.waits;
  const isFuriten = Math.random()<0.5;
  const usedKeys = [...payload.shown, ...waits].map(t=>t.suit+t.rank);
  let discards;
  if(isFuriten){
    const furitenTile = waits[Math.floor(Math.random()*waits.length)];
    const others = pickN(TILES.filter(t=>!usedKeys.includes(t.suit+t.rank)), 2);
    discards = shuffle([furitenTile, ...others]);
  } else {
    discards = pickN(TILES.filter(t=>!usedKeys.includes(t.suit+t.rank)), 3);
  }

  const waitNames = waits.map(t=>displayHtml(tileFullName(t).split("（")[0])).join("」「");
  const correct = isFuriten ? "ロンできない（フリテン）" : "ロンできる";
  const choices = shuffle(["ロンできる", "ロンできない（フリテン）"]);
  const note = isFuriten
    ? `豆知識：捨て牌の中に自分の待ち牌（「${waitNames}」）が含まれているため、フリテンとなりロンできません（ツモなら上がれます）`
    : `豆知識：捨て牌の中に自分の待ち牌（「${waitNames}」）は含まれていないので、ロンできます`;

  return {
    stage:3,
    question:`この形は「${waitNames}」待ちです。捨て牌を見て、今ロンできるか答えよう`,
    render: `<div class="tiles-row">${payload.shown.map(t=>renderTile(t)).join("")}${renderWaitPlaceholder()}</div><div class="hint" style="margin-top:10px;">あなたの捨て牌</div><div class="tiles-row" style="margin-top:2px;">${discards.map(t=>renderTile(t,"small")).join("")}</div>`,
    choices,
    answer: correct,
    note,
  };
}
function genQ3(){
  if(Math.random()<0.3) return genFuritenCheck();
  // 2枚を見せて「あと1枚で面子が完成する牌」を当てる
  // 両面待ち（例：4-5 なら 3 でも 6 でも完成）の場合は、正解として採用しなかった側の牌を
  // 選択肢からも除外することで「本当は正解なのに不正解扱いになる」事故を防ぐ
  let payload, key;
  do{
    const isKotsu = Math.random()<0.35;
    if(isKotsu){
      const t=randTile();
      payload = {shown:[{...t},{...t}], waits:[{...t}], mode:"kotsu"};
    } else {
      const suit = ["m","p","s"][Math.floor(Math.random()*3)];
      const isKanchan = Math.random()<0.35;
      if(isKanchan){
        // 嵌張(カンチャン)待ち: 例 4-6 なら 5 の1種類のみ
        const r1 = 1+Math.floor(Math.random()*7); // 1..7 (r1, r1+2 が範囲内に収まる)
        payload = {shown:[{suit,rank:r1},{suit,rank:r1+2}], waits:[{suit,rank:r1+1}], mode:"kanchan"};
      } else {
        // 両面/辺張待ち: 例 4-5 なら 3・6 の2種類、1-2なら3のみ、8-9なら7のみ
        const r1 = 1+Math.floor(Math.random()*8); // 1..8 (r1, r1+1)
        const waits=[];
        if(r1-1>=1) waits.push({suit,rank:r1-1});
        if(r1+2<=9) waits.push({suit,rank:r1+2});
        payload = {shown:[{suit,rank:r1},{suit,rank:r1+1}], waits, mode:"ryanmen"};
      }
    }
    key = payload.mode+payload.shown.map(t=>t.suit+t.rank).join(",");
  }while(isRecent(3,key));
  pushHistory(3,key);

  const shown = payload.shown;
  const waits = payload.waits;
  const waitKeys = waits.map(t=>t.suit+t.rank);
  const correctTile = waits[Math.floor(Math.random()*waits.length)];
  const correct = tileFullName(correctTile).split("（")[0];

  // もう片方の正解牌も含めて、待ち牌は誤答候補から完全に除外する
  const pool = TILES.filter(x=>!waitKeys.includes(x.suit+x.rank));
  const sameSuit = pool.filter(x=>x.suit===correctTile.suit);
  const wrongTiles = pickN(sameSuit.length>=3?sameSuit:pool, 3);
  const choices = shuffle([correct, ...wrongTiles.map(t=>tileFullName(t).split("（")[0])]);

  let note;
  if(waits.length>1){
    note = `豆知識：この形は${waits.map(t=>displayHtml(tileFullName(t).split("（")[0])).join("」「")}のどちらでも完成する「${rb("両面待ち","リャンメン")}」です`;
  } else if(payload.mode==="kanchan"){
    note = `豆知識：順子の真ん中が抜けているこの形は「${rb("嵌張待ち","カンチャン")}」です`;
  } else if(payload.mode==="ryanmen"){
    // waits.length===1のときは、1・2や8・9のような端の順子（辺張＝ペンチャン）
    note = `豆知識：端に寄ったこの形は「${rb("辺張待ち","ペンチャン")}」です（0や10の牌は無いので、待ちは1種類だけ）`;
  } else {
    note = null;
  }

  return {
    stage:3,
    question:`あと1枚そろえば${rb("面子","メンツ")}完成！ 待っている牌は？`,
    render: `<div class="tiles-row">${shown.map(t=>renderTile(t)).join("")}${renderWaitPlaceholder()}</div>`,
    choices,
    answer: correct,
    note,
  };
}

/* ==================== 役判定エンジン（本番と同じ14枚：4面子+雀頭 or 7対子 or 国士無双） ==================== */
function isHonorTile(t){ return t.suit==="z"; }
function isTerminalTile(t){ return t.suit!=="z" && (t.rank===1 || t.rank===9); }
function isTermOrHonor(t){ return isHonorTile(t) || isTerminalTile(t); }
function isGreenTile(t){ return (t.suit==="s" && [2,3,4,6,8].includes(t.rank)) || (t.suit==="z" && t.rank===6); }

function flattenHand(groups, pair){
  const tiles=[];
  groups.forEach(g=>{
    if(g.kind==="shuntsu") tiles.push({suit:g.suit,rank:g.rank},{suit:g.suit,rank:g.rank+1},{suit:g.suit,rank:g.rank+2});
    else tiles.push({suit:g.suit,rank:g.rank},{suit:g.suit,rank:g.rank},{suit:g.suit,rank:g.rank});
  });
  if(pair) tiles.push({suit:pair.suit,rank:pair.rank},{suit:pair.suit,rank:pair.rank});
  return tiles;
}

// tiles: 14枚のフラットな配列 / groups・pairは4面子+雀頭の形のときだけ渡す(七対子・国士無双はnull)
// shapeKind: "standard" | "chiitoi" | "kokushi"
function computeYaku(tiles, groups, pair, shapeKind){
  if(shapeKind==="kokushi") return {regular:[], yakuman:["国士無双【役満】"]};

  const regular=[];
  const yakuman=[];
  const numberSuits = new Set(tiles.filter(t=>t.suit!=="z").map(t=>t.suit));
  const hasHonor = tiles.some(t=>t.suit==="z");

  if(tiles.every(t=>t.suit!=="z" && t.rank>=2 && t.rank<=8)) regular.push("タンヤオ");
  // 清一色/混一色は「数牌が1種類だけ」が共通条件。字牌の有無だけで両立しないように分ける
  if(numberSuits.size===1 && hasHonor) regular.push("混一色");
  if(numberSuits.size===1 && !hasHonor) regular.push("清一色");
  if(tiles.every(isTermOrHonor)) regular.push("混老頭");

  if(shapeKind==="chiitoi") regular.push("七対子");

  if(shapeKind==="standard"){
    groups.forEach(g=>{
      if(g.kind==="kotsu" && g.suit==="z" && g.rank>=5) regular.push(`役牌（${Z_LABEL[g.rank]}）`);
    });
    if(groups.every(g=>g.kind==="kotsu")) regular.push("対々和");
    const shuntsuKeys = groups.filter(g=>g.kind==="shuntsu").map(g=>g.suit+"-"+g.rank);
    if(shuntsuKeys.some((k,i)=>shuntsuKeys.indexOf(k)!==i)) regular.push("一盃口");
    const chanta = groups.every(g=> g.kind==="kotsu" ? isTermOrHonor({suit:g.suit,rank:g.rank}) : (g.rank===1||g.rank===7))
      && isTermOrHonor(pair);
    if(chanta) regular.push("混全帯幺九（チャンタ）");
  }

  // ===== 役満（形だけで判定できるものに限定） =====
  if(tiles.every(t=>t.suit==="z")) yakuman.push("字一色【役満】");
  if(tiles.every(t=>t.suit!=="z" && (t.rank===1||t.rank===9))) yakuman.push("清老頭【役満】");
  if(tiles.every(isGreenTile)) yakuman.push("緑一色【役満】");
  if(shapeKind==="standard"){
    // 大三元/小四喜/大四喜は「3つの異なる種類」が揃っているかで判定する（同じ牌の刻子を重複カウントしない）
    const dragonRanks = new Set(groups.filter(g=>g.kind==="kotsu"&&g.suit==="z"&&g.rank>=5).map(g=>g.rank));
    if(dragonRanks.size===3) yakuman.push("大三元【役満】");
    const windRanks = new Set(groups.filter(g=>g.kind==="kotsu"&&g.suit==="z"&&g.rank<=4).map(g=>g.rank));
    if(windRanks.size===3 && pair.suit==="z" && pair.rank<=4 && !windRanks.has(pair.rank)) yakuman.push("小四喜【役満】");
    if(windRanks.size===4) yakuman.push("大四喜【役満】");
  }

  // このアプリの点数計算は常に「面前ロン」を前提にしているため、役満でなければ
  // 聴牌＋門前の条件を満たしており、リーチはいつでも宣言できる（＝常に成立する）
  if(yakuman.length===0) regular.push("立直");

  return {regular, yakuman};
}

const REGULAR_YAKU_POOL = ["立直","タンヤオ","対々和","一盃口","混一色","清一色","混老頭","混全帯幺九（チャンタ）","七対子","役牌（白）","役牌（發）","役牌（中）","役なし"];
const YAKUMAN_POOL = ["国士無双【役満】","大三元【役満】","小四喜【役満】","大四喜【役満】","字一色【役満】","清老頭【役満】","緑一色【役満】"];
const ALL_YAKU_POOL = REGULAR_YAKU_POOL.concat(YAKUMAN_POOL);

/* ==================== 簡易点数計算（面前ロン・平和なしを仮定した目安） ==================== */
const HAN_TABLE = {
  "立直":1,
  "タンヤオ":1, "対々和":2, "一盃口":1, "混一色":3, "清一色":6,
  "混老頭":2, "混全帯幺九（チャンタ）":2, "七対子":2,
  "役牌（東）":1,"役牌（南）":1,"役牌（西）":1,"役牌（北）":1,"役牌（白）":1,"役牌（發）":1,"役牌（中）":1,
};
// 符計算の内訳を返す（面前ロン・両面待ちを仮定した簡易計算）
function computeFuDetail(shapeKind, groups, pair){
  if(shapeKind==="chiitoi") return {fu:25, parts:["七対子は25符で固定"]};
  if(shapeKind==="kokushi") return {fu:null, parts:[]};
  const parts=[];
  let fu = 20;
  parts.push("基本20符");
  fu += 10;
  parts.push("面前ロン+10符");
  groups.forEach(g=>{
    if(g.kind==="kotsu"){
      const th = isTermOrHonor({suit:g.suit, rank:g.rank});
      const add = th?8:4;
      fu += add;
      const label = displayHtml(tileFullName({suit:g.suit,rank:g.rank}).split("（")[0]);
      parts.push(`${label}の刻子+${add}符`);
    }
  });
  if(pair.suit==="z" && pair.rank>=5){
    fu += 2;
    parts.push(`${Z_LABEL[pair.rank]}の雀頭+2符`);
  }
  const rounded = Math.ceil(fu/10)*10;
  if(rounded!==fu) parts.push(`合計${fu}符 → 10の位に切り上げ`);
  return {fu:rounded, parts};
}
// ドラ表示牌からドラそのものを求める（数牌は9→1、風牌は北→東、三元牌は中→白で1周する）
function doraTileFromIndicator(ind){
  if(ind.suit==="z"){
    if(ind.rank<=4) return {suit:"z", rank: ind.rank===4?1:ind.rank+1};
    return {suit:"z", rank: ind.rank===7?5:ind.rank+1};
  }
  return {suit:ind.suit, rank: ind.rank===9?1:ind.rank+1};
}
function countDora(tiles, doraTile){
  return tiles.filter(t=>t.suit===doraTile.suit && t.rank===doraTile.rank).length;
}
function renderDoraLine(indicator, doraTile){
  return `<div class="dora-line"><span>ドラ表示牌</span>${renderTile(indicator,"small")}<span>→ドラは</span>${renderTile(doraTile,"small")}</div>`;
}
function computeScoreInfo(correctSet, regular, yakuman, shapeKind, groups, pair, doraCount=0){
  if(correctSet.length===1 && correctSet[0]==="役なし"){
    return {text:"役なし → このままでは上がれません（あがるには役が最低1つ必要）"};
  }
  if(yakuman.length>0){
    const base = 8000*yakuman.length;
    const ron = base*4;
    const label = yakuman.length>1 ? `役満×${yakuman.length}（ダブル役満）` : "役満";
    return {text:`${label} → 子のロンで${ron.toLocaleString()}点（役満はドラを加算しません）`};
  }
  const baseHan = regular.reduce((sum,y)=>sum+(HAN_TABLE[y]||0),0);
  const han = baseHan + doraCount;
  const {fu, parts} = computeFuDetail(shapeKind, groups, pair);
  let base;
  let tierLabel="";
  if(han>=13){ base=8000; tierLabel="役満"; }
  else if(han>=11){ base=6000; tierLabel="三倍満"; }
  else if(han>=8){ base=4000; tierLabel="倍満"; }
  else if(han>=6){ base=3000; tierLabel="跳満"; }
  else if(han>=5){ base=2000; tierLabel="満貫"; }
  else{
    base = fu * Math.pow(2, 2+han);
    if(base>2000){ base=2000; tierLabel="満貫"; }
  }
  const ron = Math.ceil(base*4/100)*100;
  const tierText = tierLabel ? `（${tierLabel}）` : "";
  const doraText = doraCount>0 ? `（役${baseHan}翻+ドラ${doraCount}）` : "";
  return {
    text:`${han}翻${doraText}${fu}符${tierText} → 子のロンで${ron.toLocaleString()}点`,
    fuBreakdown: `符の内訳：${parts.join("＋")}`,
  };
}

/* ==================== 点数計算機（実際の手牌を手入力して計算する・mahjong_score_scanner.htmlと同じエンジン） ==================== */
// クイズ用のcomputeYaku/computeScoreInfoは「常にリーチあり・ロン限定」という簡略化を前提にしているため、
// 実際の手牌をそのまま計算する用途には使えない。ここではロン/ツモ・リーチの有無・親子・自風場風・ドラを
// すべて指定できる、より本格的な役判定・符計算・点数計算エンジンを別名で用意する（mahjong_score_scanner.html本体と同一ロジック）。
function tilesToCounts(tiles){
  const counts={};
  tiles.forEach(t=>{ const k=t.suit+t.rank; counts[k]=(counts[k]||0)+1; });
  return counts;
}
function decomposeMelds(counts){
  const keys = Object.keys(counts).filter(k=>counts[k]>0).sort();
  if(keys.length===0) return [[]];
  const key = keys[0];
  const suit = key[0];
  const rank = parseInt(key.slice(1),10);
  const results = [];
  if(counts[key] >= 3){
    counts[key]-=3;
    decomposeMelds(counts).forEach(r=>results.push([{kind:"kotsu",suit,rank}, ...r]));
    counts[key]+=3;
  }
  if(suit!=="z" && rank<=7){
    const k2=suit+(rank+1), k3=suit+(rank+2);
    if((counts[k2]||0)>0 && (counts[k3]||0)>0){
      counts[key]--; counts[k2]--; counts[k3]--;
      decomposeMelds(counts).forEach(r=>results.push([{kind:"shuntsu",suit,rank}, ...r]));
      counts[key]++; counts[k2]++; counts[k3]++;
    }
  }
  return results;
}
function decomposeStandard(tiles14){
  const counts = tilesToCounts(tiles14);
  const results = [];
  Object.keys(counts).forEach(pairKey=>{
    if(counts[pairKey] < 2) return;
    const suit=pairKey[0], rank=parseInt(pairKey.slice(1),10);
    counts[pairKey]-=2;
    const meldSets = decomposeMelds(counts);
    counts[pairKey]+=2;
    meldSets.forEach(groups=>{
      if(groups.length===4) results.push({shapeKind:"standard", groups, pair:{suit,rank}});
    });
  });
  return results;
}
function isKokushi14(tiles14){
  const orphans = [];
  ["m","p","s"].forEach(s=>{ orphans.push(s+"1"); orphans.push(s+"9"); });
  for(let r=1;r<=7;r++) orphans.push("z"+r);
  const counts = tilesToCounts(tiles14);
  const keys = Object.keys(counts);
  if(keys.length!==13) return false;
  if(keys.some(k=>!orphans.includes(k))) return false;
  const dupCount = keys.filter(k=>counts[k]===2).length;
  const singleCount = keys.filter(k=>counts[k]===1).length;
  return dupCount===1 && singleCount===12;
}
function isChiitoi14(tiles14){
  const counts = tilesToCounts(tiles14);
  const keys = Object.keys(counts);
  return keys.length===7 && keys.every(k=>counts[k]===2);
}
function decomposeHand(tiles14){
  if(tiles14.length!==14) return [];
  const results = [];
  if(isKokushi14(tiles14)) results.push({shapeKind:"kokushi"});
  if(isChiitoi14(tiles14)) results.push({shapeKind:"chiitoi"});
  results.push(...decomposeStandard(tiles14));
  return results;
}
function computeYakuForShape(tiles14, shape, opts){
  const regular=[], yakuman=[];
  if(shape.shapeKind==="kokushi"){ yakuman.push("国士無双"); return {regular, yakuman}; }

  const numberSuits = new Set(tiles14.filter(t=>t.suit!=="z").map(t=>t.suit));
  const hasHonor = tiles14.some(t=>t.suit==="z");

  if(tiles14.every(t=>t.suit!=="z" && t.rank>=2 && t.rank<=8)) regular.push("タンヤオ");
  if(numberSuits.size===1 && hasHonor) regular.push("混一色");
  if(numberSuits.size===1 && !hasHonor) regular.push("清一色");
  if(tiles14.every(isTermOrHonor)) regular.push("混老頭");
  if(tiles14.every(t=>t.suit==="z")) yakuman.push("字一色");
  if(tiles14.every(t=>t.suit!=="z" && (t.rank===1||t.rank===9))) yakuman.push("清老頭");
  if(tiles14.every(isGreenTile)) yakuman.push("緑一色");

  if(shape.shapeKind==="chiitoi") regular.push("七対子");

  if(shape.shapeKind==="standard"){
    const {groups, pair} = shape;
    groups.forEach(g=>{
      if(g.kind==="kotsu" && g.suit==="z"){
        if(g.rank>=5) regular.push(`役牌（${Z_LABEL[g.rank]}）`);
        if(opts.seatWind && g.rank===opts.seatWind) regular.push(`役牌（自風 ${Z_LABEL[g.rank]}）`);
        if(opts.roundWind && g.rank===opts.roundWind) regular.push(`役牌（場風 ${Z_LABEL[g.rank]}）`);
      }
    });
    const allKotsu = groups.every(g=>g.kind==="kotsu");
    const allShuntsu = groups.every(g=>g.kind==="shuntsu");
    if(allKotsu) regular.push("対々和");
    if(groups.filter(g=>g.kind==="kotsu").length>=3) regular.push("三暗刻");

    const shuntsuKeys = groups.filter(g=>g.kind==="shuntsu").map(g=>g.suit+"-"+g.rank);
    if(shuntsuKeys.some((k,i)=>shuntsuKeys.indexOf(k)!==i)) regular.push("一盃口");
    if(allShuntsu){
      const sorted=[...shuntsuKeys].sort();
      if(sorted[0]===sorted[1] && sorted[2]===sorted[3] && sorted[0]!==sorted[2]){
        const idx=regular.indexOf("一盃口"); if(idx!==-1) regular.splice(idx,1);
        regular.push("二盃口");
      }
    }
    const shuntsuGroups = groups.filter(g=>g.kind==="shuntsu");
    const byRankSuits={};
    shuntsuGroups.forEach(g=>{ (byRankSuits[g.rank]=byRankSuits[g.rank]||new Set()).add(g.suit); });
    if(Object.values(byRankSuits).some(s=>s.size===3)) regular.push("三色同順");
    ["m","p","s"].forEach(suit=>{
      const ranks=new Set(shuntsuGroups.filter(g=>g.suit===suit).map(g=>g.rank));
      if(ranks.has(1)&&ranks.has(4)&&ranks.has(7)) regular.push("一気通貫");
    });
    const kotsuGroups = groups.filter(g=>g.kind==="kotsu"&&g.suit!=="z");
    const byRankSuitsK={};
    kotsuGroups.forEach(g=>{ (byRankSuitsK[g.rank]=byRankSuitsK[g.rank]||new Set()).add(g.suit); });
    if(Object.values(byRankSuitsK).some(s=>s.size===3)) regular.push("三色同刻");

    const chanta = groups.every(g=> g.kind==="kotsu" ? isTermOrHonor({suit:g.suit,rank:g.rank}) : (g.rank===1||g.rank===7)) && isTermOrHonor(pair);
    if(chanta){
      const junchan = groups.every(g=> g.kind==="kotsu" ? (g.suit!=="z" && (g.rank===1||g.rank===9)) : (g.rank===1||g.rank===7)) && pair.suit!=="z";
      if(junchan) regular.push("純全帯幺九"); else regular.push("混全帯幺九（チャンタ）");
    }
    const pairIsYakuhai = pair.suit==="z" && (pair.rank>=5 || pair.rank===opts.seatWind || pair.rank===opts.roundWind);
    if(allShuntsu && !pairIsYakuhai) regular.push("平和");

    const dragonRanks = new Set(groups.filter(g=>g.kind==="kotsu"&&g.suit==="z"&&g.rank>=5).map(g=>g.rank));
    if(dragonRanks.size===3) yakuman.push("大三元");
    const windRanks = new Set(groups.filter(g=>g.kind==="kotsu"&&g.suit==="z"&&g.rank<=4).map(g=>g.rank));
    if(windRanks.size===3 && pair.suit==="z" && pair.rank<=4 && !windRanks.has(pair.rank)) yakuman.push("小四喜");
    if(windRanks.size===4) yakuman.push("大四喜");
    if(allKotsu && opts.isTsumo) yakuman.push("四暗刻");
    if(numberSuits.size===1 && !hasHonor){
      const suit=[...numberSuits][0];
      const counts={}; tiles14.forEach(t=>{counts[t.rank]=(counts[t.rank]||0)+1;});
      const need={1:3,2:1,3:1,4:1,5:1,6:1,7:1,8:1,9:3};
      if(Object.keys(need).every(r=>(counts[r]||0)>=need[r])) yakuman.push("九蓮宝燈");
    }
  }

  if(yakuman.length===0){
    if(opts.isRiichi) regular.push("立直");
    if(opts.isTsumo) regular.push("門前清自摸和");
  }
  return {regular, yakuman};
}
const SCORE_HAN_TABLE = {
  "立直":1, "タンヤオ":1, "平和":1, "門前清自摸和":1,
  "対々和":2, "一盃口":1, "混一色":3, "清一色":6,
  "混老頭":2, "混全帯幺九（チャンタ）":2, "純全帯幺九":3, "七対子":2,
  "三色同順":2, "一気通貫":2, "三色同刻":2, "三暗刻":2, "二盃口":3,
};
function scoreHanValue(name){ if(name.startsWith("役牌")) return 1; return SCORE_HAN_TABLE[name]||0; }
function scoreTileLabel(suit,rank){ return suit==="z" ? Z_LABEL[rank] : (KANSUJI[rank]+SUIT_NAME[suit]); }
function computeFuForShape(shape, opts, hasPinfu){
  if(shape.shapeKind==="chiitoi") return {fu:25, parts:["七対子は25符で固定"]};
  if(shape.shapeKind==="kokushi") return {fu:null, parts:[]};
  if(hasPinfu){
    if(opts.isTsumo) return {fu:20, parts:["平和+ツモは20符で固定"]};
    return {fu:30, parts:["平和+ロンは基本20符+面前ロン10符=30符で固定"]};
  }
  const parts=[]; let fu=20; parts.push("基本20符");
  if(opts.isTsumo){ fu+=2; parts.push("ツモ+2符"); } else { fu+=10; parts.push("面前ロン+10符"); }
  shape.groups.forEach(g=>{
    if(g.kind==="kotsu"){
      const th = isTermOrHonor({suit:g.suit,rank:g.rank});
      const add = th?8:4; fu+=add;
      parts.push(`${scoreTileLabel(g.suit,g.rank)}の暗刻+${add}符`);
    }
  });
  if(shape.pair.suit==="z"){
    if(shape.pair.rank>=5){ fu+=2; parts.push(`${Z_LABEL[shape.pair.rank]}の雀頭+2符`); }
    if(opts.seatWind && shape.pair.rank===opts.seatWind){ fu+=2; parts.push(`自風(${Z_LABEL[shape.pair.rank]})の雀頭+2符`); }
    if(opts.roundWind && shape.pair.rank===opts.roundWind){ fu+=2; parts.push(`場風(${Z_LABEL[shape.pair.rank]})の雀頭+2符`); }
  }
  const rounded = Math.ceil(fu/10)*10;
  if(rounded!==fu) parts.push(`合計${fu}符 → 10の位に切り上げ`);
  return {fu:rounded, parts};
}
function scoreCeil100(n){ return Math.ceil(n/100)*100; }
function scoreFromBase(base){
  return {
    ronNonDealer: scoreCeil100(base*4), ronDealer: scoreCeil100(base*6),
    tsumoNonDealerFromNonDealer: scoreCeil100(base*1), tsumoNonDealerFromDealer: scoreCeil100(base*2),
    tsumoDealerEach: scoreCeil100(base*2),
  };
}
function scoreForShape(tiles14, shape, opts, doraCount){
  const {regular, yakuman} = computeYakuForShape(tiles14, shape, opts);
  if(yakuman.length>0){
    const base = 8000*yakuman.length;
    return { yakuman, regular:[], han:null, fu:null, tier: yakuman.length>1?`役満×${yakuman.length}（ダブル役満）`:"役満", base, points:scoreFromBase(base), fuParts:[], totalPoints: base*4 };
  }
  if(regular.length===0){
    return { yakuman:[], regular:[], han:0, fu:null, tier:"役なし", base:0, points:null, fuParts:[], totalPoints:-1 };
  }
  const hasPinfu = regular.includes("平和");
  const baseHan = regular.reduce((sum,y)=>sum+scoreHanValue(y),0);
  const han = baseHan + doraCount;
  const {fu, parts} = computeFuForShape(shape, opts, hasPinfu);
  let base, tier="";
  if(han>=13){ base=8000; tier="役満級（13翻以上）"; }
  else if(han>=11){ base=6000; tier="三倍満"; }
  else if(han>=8){ base=4000; tier="倍満"; }
  else if(han>=6){ base=3000; tier="跳満"; }
  else if(han>=5){ base=2000; tier="満貫"; }
  else{ base = fu * Math.pow(2, 2+han); if(base>2000){ base=2000; tier="満貫"; } }
  return { yakuman:[], regular, han, fu, tier, base, points:scoreFromBase(base), fuParts:parts, doraCount, baseHan, totalPoints: base*4 };
}
function bestScoreResult(tiles14, opts, doraCount){
  const shapes = decomposeHand(tiles14);
  if(shapes.length===0) return null;
  let best=null;
  shapes.forEach(shape=>{
    const r = scoreForShape(tiles14, shape, opts, doraCount);
    r.shape = shape;
    if(!best || r.totalPoints>best.totalPoints) best=r;
  });
  return best;
}

function demoStepHtml(step){
  if(step.noTiles) return "";
  if(step.chunks) return handChunksHtml(step.chunks, "");
  const tilesHtml = step.flat.map((t,i)=>{
    const cls = (step.highlightLast && i===step.flat.length-1) ? ' style="box-shadow:0 0 0 3px var(--gold);border-radius:12px;"' : "";
    return `<span${cls}>${renderTile(t,"small")}</span>`;
  }).join("");
  let html = `<div class="tiles-row hand-row">${tilesHtml}</div>`;
  if(step.discard){
    html += `<div class="hint" style="margin-top:10px;">${step.discardNote}</div><div class="tiles-row" style="margin-top:2px;">${step.discard.map(t=>renderTile(t,"small")).join("")}</div>`;
  }
  return html;
}

function startScoreCalc(){
  go("scoreCalc", {
    calcTiles: [],
    calcDora: [],
    calcWinMethod: "ron",
    calcRiichi: false,
    calcDealer: false,
    calcSeatWind: null,
    calcRoundWind: null,
  });
}
function renderScoreCalcResult(){
  const s = state;
  if(s.calcTiles.length!==14){
    return `<div class="error-box">手牌が${s.calcTiles.length}枚です。14枚になるように調整してください。</div>`;
  }
  const opts = {
    seatWind: s.calcSeatWind, roundWind: s.calcRoundWind,
    isTsumo: s.calcWinMethod==="tsumo", isRiichi: s.calcRiichi,
  };
  let doraCount = 0;
  s.calcDora.forEach(ind=>{ doraCount += countDora(s.calcTiles, doraTileFromIndicator(ind)); });
  const r = bestScoreResult(s.calcTiles, opts, doraCount);
  if(!r){
    return `<div class="error-box">この14枚では手が成立しません（4面子+雀頭、七対子、国士無双のいずれの形にもなっていません）。牌の組み合わせを確認してください。</div>`;
  }
  if(r.tier==="役なし"){
    return `<div class="error-box">役なし → このままでは上がれません（リーチ・ツモなど、成立条件を見直してください）</div>`;
  }
  const yakuList = r.yakuman.length ? r.yakuman : r.regular;
  const yakuHtml = yakuList.map(y=>`<span class="yaku-chip">${y}</span>`).join("");
  const p = r.points;
  let scoreLine, detailLines=[];
  if(opts.isTsumo){
    if(s.calcDealer){
      scoreLine = `${p.tsumoDealerEach.toLocaleString()}点オール（合計${(p.tsumoDealerEach*3).toLocaleString()}点）`;
    } else {
      scoreLine = `${p.tsumoNonDealerFromNonDealer.toLocaleString()} / ${p.tsumoNonDealerFromDealer.toLocaleString()}点（合計${(p.tsumoNonDealerFromNonDealer*2+p.tsumoNonDealerFromDealer).toLocaleString()}点）`;
      detailLines.push(`子から${p.tsumoNonDealerFromNonDealer.toLocaleString()}点ずつ、親から${p.tsumoNonDealerFromDealer.toLocaleString()}点`);
    }
  } else {
    scoreLine = `${(s.calcDealer?p.ronDealer:p.ronNonDealer).toLocaleString()}点`;
  }
  const hanFuText = r.yakuman.length ? "" : `${r.han}翻${r.doraCount>0?`（役${r.baseHan}翻+ドラ${r.doraCount}）`:""}${r.fu}符　`;
  const fuBreakdown = r.fuParts.length ? `<div class="fu-list">符の内訳：${r.fuParts.join("／")}</div>` : "";
  return `
    <div class="hint">検出した役</div>
    <div style="text-align:center;">${yakuHtml}</div>
    <div class="score-big">${hanFuText}${r.tier}</div>
    <div style="text-align:center;font-size:1.1rem;">${scoreLine}</div>
    ${detailLines.map(l=>`<div class="hint">${l}</div>`).join("")}
    ${fuBreakdown}
  `;
}

function buildOptions(correctSet, pool, size){
  const wrongPool = pool.filter(p=>!correctSet.includes(p));
  const need = Math.max(0, size - correctSet.length);
  const picks = pickN(wrongPool, Math.min(need, wrongPool.length));
  return shuffle([...correctSet, ...picks]);
}
function randomBasicMeld(){
  if(Math.random()<0.55){
    const suit=["m","p","s"][Math.floor(Math.random()*3)];
    const low=1+Math.floor(Math.random()*7);
    return {kind:"shuntsu", suit, rank:low};
  }
  const t=randTile();
  return {kind:"kotsu", suit:t.suit, rank:t.rank};
}
function randomPair(){ const t=randTile(); return {suit:t.suit, rank:t.rank}; }
function pickSuit(){ return ["m","p","s"][Math.floor(Math.random()*3)]; }

function renderHandGrouped(groups, pair){
  const chunks = groups.map(g=>{
    if(g.kind==="shuntsu") return [{suit:g.suit,rank:g.rank},{suit:g.suit,rank:g.rank+1},{suit:g.suit,rank:g.rank+2}];
    return [{suit:g.suit,rank:g.rank},{suit:g.suit,rank:g.rank},{suit:g.suit,rank:g.rank}];
  });
  chunks.push([{suit:pair.suit,rank:pair.rank},{suit:pair.suit,rank:pair.rank}]);
  return `<div class="tiles-row hand-row">${chunks.map(c=>`<span class="hand-group">${c.map(t=>renderTile(t,"small")).join("")}</span>`).join("")}</div>`;
}
function renderFlatHand(tiles){
  return `<div class="tiles-row">${tiles.map(t=>renderTile(t,"small")).join("")}</div>`;
}
// 麻雀牌は同じ種類が4枚までしか存在しない。生成した手がそれを超えていないか確認する
function exceedsFourCopies(tiles){
  const counts={};
  for(const t of tiles){
    const k=t.suit+t.rank;
    counts[k]=(counts[k]||0)+1;
    if(counts[k]>4) return true;
  }
  return false;
}

/* ==================== 問題生成: ステージ4 役当て（本番と同じ14枚） ==================== */
function genHand4(){
  const roll = Math.random();
  if(roll<0.10){
    // 七対子
    const used=[]; const pairs=[];
    while(pairs.length<7){
      const t=randTile(); const k=t.suit+t.rank;
      if(used.includes(k)) continue;
      used.push(k); pairs.push(t);
    }
    return {shapeKind:"chiitoi", tiles: pairs.flatMap(p=>[{...p},{...p}])};
  } else if(roll<0.22){
    // タンヤオ寄り
    const groups=[];
    for(let i=0;i<4;i++){
      const suit=pickSuit();
      groups.push(Math.random()<0.5 ? {kind:"shuntsu",suit,rank:2+Math.floor(Math.random()*5)} : {kind:"kotsu",suit,rank:2+Math.floor(Math.random()*7)});
    }
    const pair={suit:pickSuit(), rank:2+Math.floor(Math.random()*7)};
    return {shapeKind:"standard", groups, pair};
  } else if(roll<0.34){
    // 役牌（中/發/白）
    const yakuhai=[5,6,7][Math.floor(Math.random()*3)];
    const groups=[{kind:"kotsu",suit:"z",rank:yakuhai}, randomBasicMeld(), randomBasicMeld(), randomBasicMeld()];
    return {shapeKind:"standard", groups, pair:randomPair()};
  } else if(roll<0.44){
    // 対々和
    const groups=[]; for(let i=0;i<4;i++){ const t=randTile(); groups.push({kind:"kotsu",suit:t.suit,rank:t.rank}); }
    return {shapeKind:"standard", groups, pair:randomPair()};
  } else if(roll<0.54){
    // 一盃口
    const suit=pickSuit(); const low=1+Math.floor(Math.random()*7);
    const groups=[{kind:"shuntsu",suit,rank:low},{kind:"shuntsu",suit,rank:low}, randomBasicMeld(), randomBasicMeld()];
    return {shapeKind:"standard", groups, pair:randomPair()};
  } else if(roll<0.66){
    // 混一色
    const suit=pickSuit();
    const groups=[]; for(let i=0;i<4;i++){
      const r=Math.random();
      if(r<0.3) groups.push({kind:"kotsu",suit:"z",rank:1+Math.floor(Math.random()*7)});
      else if(r<0.65) groups.push({kind:"kotsu",suit,rank:1+Math.floor(Math.random()*9)});
      else groups.push({kind:"shuntsu",suit,rank:1+Math.floor(Math.random()*7)});
    }
    const pair = Math.random()<0.4 ? {suit:"z",rank:1+Math.floor(Math.random()*7)} : {suit,rank:1+Math.floor(Math.random()*9)};
    return {shapeKind:"standard", groups, pair};
  } else if(roll<0.78){
    // 清一色
    const suit=pickSuit();
    const groups=[]; for(let i=0;i<4;i++){
      groups.push(Math.random()<0.5 ? {kind:"kotsu",suit,rank:1+Math.floor(Math.random()*9)} : {kind:"shuntsu",suit,rank:1+Math.floor(Math.random()*7)});
    }
    return {shapeKind:"standard", groups, pair:{suit,rank:1+Math.floor(Math.random()*9)}};
  } else if(roll<0.87){
    // 混老頭寄り（老頭牌・字牌の刻子中心）
    const groups=[]; for(let i=0;i<4;i++){
      groups.push(Math.random()<0.5 ? {kind:"kotsu",suit:"z",rank:1+Math.floor(Math.random()*7)} : {kind:"kotsu",suit:pickSuit(),rank:Math.random()<0.5?1:9});
    }
    const pair = Math.random()<0.5 ? {suit:"z",rank:1+Math.floor(Math.random()*7)} : {suit:pickSuit(),rank:Math.random()<0.5?1:9};
    return {shapeKind:"standard", groups, pair};
  } else if(roll<0.94){
    // チャンタ寄り
    const groups=[]; for(let i=0;i<4;i++){
      const r=Math.random();
      if(r<0.35) groups.push({kind:"kotsu",suit:"z",rank:1+Math.floor(Math.random()*7)});
      else if(r<0.7) groups.push({kind:"kotsu",suit:pickSuit(),rank:Math.random()<0.5?1:9});
      else groups.push({kind:"shuntsu",suit:pickSuit(),rank:Math.random()<0.5?1:7});
    }
    const pair = Math.random()<0.5 ? {suit:"z",rank:1+Math.floor(Math.random()*7)} : {suit:pickSuit(),rank:Math.random()<0.5?1:9};
    return {shapeKind:"standard", groups, pair};
  }
  // 完全ランダム（役なしのことも多い。見抜く力を試す）
  const groups=[]; for(let i=0;i<4;i++) groups.push(randomBasicMeld());
  return {shapeKind:"standard", groups, pair:randomPair()};
}

// 役の併用ミニ出題：2つの役が同じ手で同時に成立できるかを問う（用語解説の「役の併用」データを流用）
function genYakuComboCheck(){
  const isCompatible = Math.random()<0.5;
  const pool = isCompatible ? YAKU_COMPATIBLE_EXAMPLES : YAKU_EXCLUSIVE_PAIRS;
  let item, key;
  do{
    item = pool[Math.floor(Math.random()*pool.length)];
    key = "combo|"+(isCompatible?item.combo.join(","):item.pair.join(","));
  }while(isRecent(4,key));
  pushHistory(4,key);

  const names = isCompatible ? item.combo : item.pair;
  const correct = isCompatible ? "併用できる" : "併用できない";
  const choices = shuffle(["併用できる","併用できない"]);
  const note = isCompatible ? item.note : item.reason;
  const namesHtml = names.map(n=>`<span class="yaku-han-chip">${n}</span>`).join(" + ");

  return {
    stage:4,
    question:"次の役の組み合わせは、1つの手で同時に成立できますか？",
    render: `<div class="hint" style="margin:14px 0;font-size:1rem;">${namesHtml}</div>`,
    choices,
    answer: correct,
    note,
  };
}
function genQ4(){
  if(Math.random()<0.25) return genYakuComboCheck();
  let h, key, tiles;
  while(true){
    h = genHand4();
    tiles = h.shapeKind==="chiitoi" ? h.tiles : flattenHand(h.groups, h.pair);
    if(exceedsFourCopies(tiles)) continue; // 同じ牌が5枚以上になる物理的にありえない手はやり直す
    key = h.shapeKind + "|" + (h.shapeKind==="chiitoi"
      ? h.tiles.map(t=>t.suit+t.rank).sort().join(",")
      : h.groups.map(g=>g.kind+g.suit+g.rank).join(",")+"|"+h.pair.suit+h.pair.rank);
    if(isRecent(4,key)) continue;
    break;
  }
  pushHistory(4,key);

  const {regular, yakuman} = computeYaku(tiles, h.shapeKind==="standard"?h.groups:null, h.shapeKind==="standard"?h.pair:null, h.shapeKind);
  let correctSet = yakuman.length ? yakuman : regular;
  if(correctSet.length===0) correctSet=["役なし"];

  const doraIndicator = randTile();
  const doraTile = doraTileFromIndicator(doraIndicator);
  const doraCount = yakuman.length===0 ? countDora(tiles, doraTile) : 0;

  const options = buildOptions(correctSet, ALL_YAKU_POOL, 6);
  const handRender = h.shapeKind==="standard" ? renderHandGrouped(h.groups, h.pair) : renderFlatHand(tiles);
  const render = handRender + renderDoraLine(doraIndicator, doraTile);
  const scoreInfo = computeScoreInfo(correctSet, regular, yakuman, h.shapeKind, h.groups, h.pair, doraCount);

  return {
    stage:4,
    multi:true,
    question:"この手に当てはまる役をすべて選んでください（複数のことも、役なしのこともあります）",
    render,
    options,
    correctSet,
    scoreInfo,
  };
}

/* ==================== 問題生成: ステージ6 役満を見抜こう ==================== */
function genHand6(){
  const roll = Math.random();
  if(roll<0.14){
    // 国士無双: 老頭牌9種+字牌7種の13種類 + そのうち1種類が重複
    const terms=[];
    ["m","p","s"].forEach(suit=>{ terms.push({suit,rank:1}); terms.push({suit,rank:9}); });
    for(let r=1;r<=7;r++) terms.push({suit:"z",rank:r});
    const dup = terms[Math.floor(Math.random()*terms.length)];
    return {shapeKind:"kokushi", tiles:[...terms, {...dup}]};
  } else if(roll<0.28){
    // 大三元: 中發白すべて刻子
    const groups=[{kind:"kotsu",suit:"z",rank:5},{kind:"kotsu",suit:"z",rank:6},{kind:"kotsu",suit:"z",rank:7}, randomBasicMeld()];
    return {shapeKind:"standard", groups, pair:randomPair()};
  } else if(roll<0.42){
    // 小四喜: 風牌3種の刻子＋残り1種の風牌が雀頭
    const winds=shuffle([1,2,3,4]);
    const groups=winds.slice(0,3).map(r=>({kind:"kotsu",suit:"z",rank:r})).concat([randomBasicMeld()]);
    return {shapeKind:"standard", groups, pair:{suit:"z",rank:winds[3]}};
  } else if(roll<0.50){
    // 大四喜: 風牌4種すべて刻子
    const groups=[1,2,3,4].map(r=>({kind:"kotsu",suit:"z",rank:r}));
    return {shapeKind:"standard", groups, pair:randomPair()};
  } else if(roll<0.64){
    // 字一色: 字牌のみの刻子4組＋字牌の雀頭
    const picks = pickN([1,2,3,4,5,6,7],4);
    const groups = picks.map(r=>({kind:"kotsu",suit:"z",rank:r}));
    const pr = [1,2,3,4,5,6,7][Math.floor(Math.random()*7)];
    return {shapeKind:"standard", groups, pair:{suit:"z",rank:pr}};
  } else if(roll<0.78){
    // 清老頭: 老頭牌(1,9)のみの刻子4組＋老頭牌の雀頭
    const groups=[]; for(let i=0;i<4;i++){ groups.push({kind:"kotsu",suit:pickSuit(),rank:Math.random()<0.5?1:9}); }
    return {shapeKind:"standard", groups, pair:{suit:pickSuit(),rank:Math.random()<0.5?1:9}};
  } else if(roll<0.90){
    // 緑一色: 索子の2,3,4,6,8と發のみ
    const greenRanks=[2,3,4,6,8];
    const groups=[]; for(let i=0;i<4;i++){
      const r=Math.random();
      if(r<0.25) groups.push({kind:"kotsu",suit:"z",rank:6});
      else if(r<0.55) groups.push({kind:"shuntsu",suit:"s",rank:2});
      else groups.push({kind:"kotsu",suit:"s",rank:greenRanks[Math.floor(Math.random()*greenRanks.length)]});
    }
    const pair = Math.random()<0.25 ? {suit:"z",rank:6} : {suit:"s",rank:greenRanks[Math.floor(Math.random()*greenRanks.length)]};
    return {shapeKind:"standard", groups, pair};
  }
  // 役満っぽく見えて実際は届いていない「ニアミス」の手（力試し）
  const groups=[{kind:"kotsu",suit:"z",rank:5},{kind:"kotsu",suit:"z",rank:6}, randomBasicMeld(), randomBasicMeld()];
  return {shapeKind:"standard", groups, pair:randomPair()};
}

function genQ6(){
  let h, key, tiles;
  while(true){
    h = genHand6();
    tiles = h.shapeKind==="kokushi" ? h.tiles : flattenHand(h.groups, h.pair);
    if(exceedsFourCopies(tiles)) continue; // 同じ牌が5枚以上になる物理的にありえない手はやり直す
    key = h.shapeKind + "|" + (h.shapeKind==="kokushi"
      ? h.tiles.map(t=>t.suit+t.rank).sort().join(",")
      : h.groups.map(g=>g.kind+g.suit+g.rank).join(",")+"|"+h.pair.suit+h.pair.rank);
    if(isRecent(6,key)) continue;
    break;
  }
  pushHistory(6,key);

  const {regular, yakuman} = computeYaku(tiles, h.shapeKind==="standard"?h.groups:null, h.shapeKind==="standard"?h.pair:null, h.shapeKind);
  let correctSet = yakuman.length ? yakuman : regular;
  if(correctSet.length===0) correctSet=["役なし"];

  const doraIndicator = randTile();
  const doraTile = doraTileFromIndicator(doraIndicator);
  const doraCount = yakuman.length===0 ? countDora(tiles, doraTile) : 0;

  const options = buildOptions(correctSet, ALL_YAKU_POOL, 6);
  const handRender = h.shapeKind==="standard" ? renderHandGrouped(h.groups, h.pair) : renderFlatHand(tiles);
  const render = handRender + renderDoraLine(doraIndicator, doraTile);
  const scoreInfo = computeScoreInfo(correctSet, regular, yakuman, h.shapeKind, h.groups, h.pair, doraCount);

  return {
