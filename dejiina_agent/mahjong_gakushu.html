}

/* ==================== 手牌分解エンジン（受け入れ枚数の判定に使用） ==================== */
// 14枚が「4面子+雀頭」の形に組めるかどうかをバックトラック法で判定する（mahjong_score_scanner.htmlと同じアルゴリズム）。
// 七対子・国士無双は「何切る？」の受け入れ判定では稀なケースなので、ここでは標準形のみ簡略的に扱う。
function tilesToCountsMap(tiles){
  const counts={};
  tiles.forEach(t=>{ const k=t.suit+t.rank; counts[k]=(counts[k]||0)+1; });
  return counts;
}
function decomposeMeldsForUkeire(counts){
  const keys = Object.keys(counts).filter(k=>counts[k]>0).sort();
  if(keys.length===0) return true; // 全部消費できた
  const key = keys[0];
  const suit = key[0];
  const rank = parseInt(key.slice(1),10);
  if(counts[key] >= 3){
    counts[key]-=3;
    if(decomposeMeldsForUkeire(counts)){ counts[key]+=3; return true; }
    counts[key]+=3;
  }
  if(suit!=="z" && rank<=7){
    const k2=suit+(rank+1), k3=suit+(rank+2);
    if((counts[k2]||0)>0 && (counts[k3]||0)>0){
      counts[key]--; counts[k2]--; counts[k3]--;
      if(decomposeMeldsForUkeire(counts)){ counts[key]++; counts[k2]++; counts[k3]++; return true; }
      counts[key]++; counts[k2]++; counts[k3]++;
    }
  }
  return false;
}
function isStandardWin14(tiles14){
  if(tiles14.length!==14) return false;
  const counts = tilesToCountsMap(tiles14);
  for(const pairKey of Object.keys(counts)){
    if(counts[pairKey] < 2) continue;
    counts[pairKey]-=2;
    const ok = decomposeMeldsForUkeire(counts);
    counts[pairKey]+=2;
    if(ok) return true;
  }
  return false;
}
// 13枚の手が聴牌かどうかを判定し、聴牌なら待ち牌（受け入れ）をすべて返す
function tenpaiWaits13(tiles13){
  const waits=[];
  TILES.forEach(cand=>{
    if(isStandardWin14([...tiles13, cand])) waits.push(cand);
  });
  return waits;
}

/* ==================== 問題生成: ステージ7 何切る？（牌効率・実践） ==================== */
// 本格的な受け入れ枚数の考え方：3面子+雀頭が完成した状態から、あと1組だけ崩れている14枚を作り、
// 崩れた組の「浮き牌」を切ればテンパイに直結することを、実際に手牌分解エンジンで検証しながら出題する。
function genUkeireCheck(){
  let tiles14, correctIdx, waits, key, attempts=0;
  outer: while(attempts<40){
    attempts++;
    const g1 = randomMeldTiles(), g2 = randomMeldTiles(), g3 = randomMeldTiles();
    const pt = randTile(); const pair=[{...pt},{...pt}];
    const brokenBase = randomMeldTiles();
    const keepTwo = brokenBase.slice(0,2);
    const usedKeys = [...g1,...g2,...g3,...pair,...keepTwo].map(t=>t.suit+t.rank);
    const strayPool = TILES.filter(t=>!usedKeys.includes(t.suit+t.rank));
    if(strayPool.length===0) continue;
    const strayTile = strayPool[Math.floor(Math.random()*strayPool.length)];
    tiles14 = [...g1,...g2,...g3,...pair,...keepTwo,strayTile];
    if(exceedsFourCopies(tiles14)) continue;

    const tenpaiChoices=[];
    for(let i=0;i<tiles14.length;i++){
      const rest=[...tiles14]; rest.splice(i,1);
      const w = tenpaiWaits13(rest);
      if(w.length>0) tenpaiChoices.push({idx:i, waits:w});
    }
    if(tenpaiChoices.length!==1) continue; // 正解が一意に定まる手だけ採用する

    key = tiles14.map(t=>t.suit+t.rank).sort().join(",");
    if(isRecent(7,key)) continue;
    correctIdx = tenpaiChoices[0].idx;
    waits = tenpaiChoices[0].waits;
    break outer;
  }
  if(correctIdx===undefined){
    // ごく稀に40回で条件を満たす手が作れなかった場合は、既存のシンプルな出題にフォールバックする
    return genQ7Basic();
  }
  pushHistory(7,key);

  const items = tiles14.map((t,i)=>({t, role: i===correctIdx ? "floaterBad" : "floaterGood"}));
  const waitNames = waits.map(w=>displayHtml(tileFullName(w).split("（")[0])).join("・");

  return {
    stage:7,
    tileClick:true,
    question:"この14枚、どれを切ればテンパイに一直線ですか？（受け入れを考えて牌をクリックしよう・上級編）",
    tiles: shuffle(items),
    note:`豆知識：この牌を切ると「${waitNames}」待ちの聴牌になります。他の牌を切ると、せっかく完成に近づいていた組み合わせを崩してしまい、テンパイが遠のきます`,
    goodHint:"（その牌を切ると、まだ完成していない組み合わせが残ってしまい、テンパイには届きません）",
  };
}
function randomMeldTiles(){
  if(Math.random()<0.5){
    const suit=pickSuit(); const low=1+Math.floor(Math.random()*7);
    return [T(suit,low),T(suit,low+1),T(suit,low+2)];
  }
  const t=randTile();
  return [{...t},{...t},{...t}];
}
// 2面子+対子+塔子2つ+浮き牌2枚（中張牌1・老頭牌または字牌1）の14枚。
// 「浮いている牌はどちらも要らないが、つながりの少ない老頭牌・字牌から先に切るべき」という
// 実戦的な牌効率の考え方を、実際に牌をクリックして選ぶ形式で出題する。
// シナリオを分けることで「字牌っぽい牌を切ればいい」という表面的なパターンだけでは解けないようにする。
// タイプA: まん中の数牌 vs 老頭牌/風牌（数牌のつながりやすさを比べる）
// タイプB: 三元牌 vs 風牌（同じ字牌同士でも、役牌になりうる三元牌の方が価値が高いことを比べる）
function genQ7(){
  // 3割の確率で「本格的な受け入れ枚数計算」の上級バージョンに分岐する
  if(Math.random()<0.3) return genUkeireCheck();
  return genQ7Basic();
}
function genQ7Basic(){
  // 「風牌を切れば正解」に偏りすぎないよう、タイプB(三元牌vs風牌、常に風牌が正解)は少なめの15%にする
  const scenario = Math.random()<0.85 ? "middleVsEdge" : "dragonVsWind"; // ループ外で固定し、比率を安定させる
  let group1,group2,pairTiles,taatsu1,taatsu2,floaterGood,floaterBad,key;
  while(true){
    group1=randomMeldTiles();
    group2=randomMeldTiles();
    const pt=randTile(); pairTiles=[{...pt},{...pt}];
    const t1suit=pickSuit(); const t1low=1+Math.floor(Math.random()*7);
    taatsu1=[T(t1suit,t1low),T(t1suit,t1low+1)];
    const t2suit=pickSuit(); const t2low=1+Math.floor(Math.random()*7);
    taatsu2=[T(t2suit,t2low),T(t2suit,t2low+1)];

    if(scenario==="middleVsEdge"){
      const goodSuit=pickSuit(); const goodRank=3+Math.floor(Math.random()*5); // 3〜7の中張牌
      floaterGood=T(goodSuit,goodRank);
      const badIsWind=Math.random()<0.2; // まん中の数牌の比較相手も、風牌より老頭牌を多めにする
      floaterBad = badIsWind ? T("z",1+Math.floor(Math.random()*4)) : T(pickSuit(), Math.random()<0.5?1:9);
    } else {
      floaterGood = T("z", 5+Math.floor(Math.random()*3)); // 三元牌(白發中)
      floaterBad = T("z", 1+Math.floor(Math.random()*4)); // 風牌(東南西北)
    }

    const allTiles=[...group1,...group2,...pairTiles,...taatsu1,...taatsu2,floaterGood,floaterBad];
    if(exceedsFourCopies(allTiles)) continue;
    const floaterKeys=[floaterGood.suit+floaterGood.rank, floaterBad.suit+floaterBad.rank];
    if(floaterKeys[0]===floaterKeys[1]) continue;
    const othersKeys=[...group1,...group2,...pairTiles,...taatsu1,...taatsu2].map(t=>t.suit+t.rank);
    if(othersKeys.includes(floaterKeys[0]) || othersKeys.includes(floaterKeys[1])) continue;

    key = allTiles.map(t=>t.suit+t.rank).sort().join(",")+"|"+floaterKeys[1];
    if(isRecent(7,key)) continue;
    break;
  }
  pushHistory(7,key);

  const items = shuffle([
    ...group1.map(t=>({t, role:"group"})),
    ...group2.map(t=>({t, role:"group"})),
    ...pairTiles.map(t=>({t, role:"pair"})),
    ...taatsu1.map(t=>({t, role:"taatsu"})),
    ...taatsu2.map(t=>({t, role:"taatsu"})),
    {t:floaterGood, role:"floaterGood"},
    {t:floaterBad, role:"floaterBad"},
  ]);

  const note = scenario==="middleVsEdge"
    ? `豆知識：${rb("老頭牌","ロウトウハイ")}や風牌は隣に使える数牌が少なく、${rb("面子","メンツ")}になりにくいので、まん中の数牌より先に切るのが基本です`
    : `豆知識：${rb("三元牌","さんげんぱい")}（白・發・中）は対子・刻子になれば${rb("役牌","やくはい")}という役がつきますが、風牌は自分の風・場の風でない限り役につながりません。同じ字牌でも風牌の方を先に切るのが基本です`;
  const goodHint = scenario==="middleVsEdge"
    ? "（惜しい！そちらも浮いていますが、老頭牌・風牌の方を先に切るのが基本です）"
    : "（惜しい！そちらは三元牌なので、役牌になる可能性を残して活かしておきたい牌です）";

  return {
    stage:7,
    tileClick:true,
    question:"この14枚の手牌。今、切るべき牌はどれ？（牌をクリックして選ぼう）",
    tiles: items,
    note,
    goodHint,
  };
}

/* ==================== 問題生成: ステージ8 危険度を見抜く（現物の考え方・中級編） ==================== */
// 相手の捨て牌（4〜6枚）を見せ、候補の牌の中から「絶対に安全な牌＝現物」を1つクリックで選ばせる。
// 筋・壁などの確率的な安全度は扱わず、フリテンのルールで100%断定できる「現物」だけを扱うことで
// このアプリの他のクイズと同じく「必ず1つに断定できる」正確な出題にしている。
function genQ8(){
  let discards, safeTile, unsafeTiles, key;
  while(true){
    discards = pickN(TILES, 4+Math.floor(Math.random()*3)); // 相手の捨て牌4〜6枚
    safeTile = discards[Math.floor(Math.random()*discards.length)]; // 捨て牌の中から現物を1枚選ぶ
    const discardKeys = discards.map(t=>t.suit+t.rank);
    const pool = TILES.filter(t=>!discardKeys.includes(t.suit+t.rank));
    unsafeTiles = pickN(pool, 3); // 捨て牌に含まれない(安全と断定できない)候補3枚
    key = [...discardKeys, ...unsafeTiles.map(t=>t.suit+t.rank)].sort().join(",")+"|"+safeTile.suit+safeTile.rank;
    if(isRecent(8,key)) continue;
    break;
  }
  pushHistory(8,key);

  const items = shuffle([
    {t:safeTile, role:"floaterBad"}, // 正解=現物（絶対安全）。role名は他ステージと共通の仕組みを流用
    ...unsafeTiles.map(t=>({t, role:"floaterGood"})), // 不正解=まだ捨てられていない「未知の牌」
  ]);

  const discardsHtml = `<div class="hint" style="margin-bottom:6px;">相手の捨て牌</div><div class="tiles-row" style="margin-bottom:14px;">${discards.map(t=>renderTile(t,"small")).join("")}</div>`;

  return {
    stage:8,
    tileClick:true,
    question:"相手の捨て牌を見て、今切っても絶対にロンされない（100%安全な）牌はどれ？（牌をクリックして選ぼう）",
    contextHtml: discardsHtml,
    tiles: items,
    note:`豆知識：相手がすでに捨てた牌（${rb("現物","げんぶつ")}）は、その人にとって「見逃した待ち牌」になるため、フリテンのルールでロンできません。まだ捨てられていない牌は、危険か安全か断定できない牌です`,
    goodHint:"（その牌はまだ相手の捨て牌にありません。安全に見えても、本当に安全かどうかは断定できません）",
  };
}

/* ==================== 問題生成: ステージ9 筋・押し引きを学ぶ（中級編） ==================== */
// 筋：ある牌を切っているということは、それを含む両面待ちをその手では作っていないはず、という考え方。
// 4〜6を切った場合は両側（例：5切りなら2と8）が同時にスジになる「両面2つ分」のケースがあるため、
// answerTileClickは複数の正解(role==="floaterBad")を許容する仕組みにして、どちらをクリックしても正解にしている。
function sujiPartners(rank){
  const arr=[];
  if(rank-3>=1) arr.push(rank-3);
  if(rank+3<=9) arr.push(rank+3);
  return arr;
}
function genSujiCheck(){
  let suit, rank, partners, key;
  do{
    suit = pickSuit();
    rank = 1+Math.floor(Math.random()*9);
    partners = sujiPartners(rank);
    key = "suji|"+suit+rank;
  }while(isRecent(9,key));
  pushHistory(9,key);

  const discardTile = T(suit, rank);
  const correctTiles = partners.map(r=>T(suit,r));
  const usedRanks = [rank, ...partners];
  const wrongPool = [];
  for(let r=1;r<=9;r++){ if(!usedRanks.includes(r)) wrongPool.push(T(suit,r)); }
  const wrongTiles = pickN(wrongPool, Math.min(3, wrongPool.length));

  const items = shuffle([
    ...correctTiles.map(t=>({t, role:"floaterBad"})),
    ...wrongTiles.map(t=>({t, role:"floaterGood"})),
  ]);

  const discardsHtml = `<div class="hint" style="margin-bottom:6px;">相手が捨てた牌</div><div class="tiles-row" style="margin-bottom:14px;">${renderTile(discardTile)}</div>`;

  let note;
  if(partners.length===2){
    note = `豆知識：${rank}を切っているということは、${rank}を含む両面待ち（${rank-2}${rank-1}で${rank-3}・${rank}待ち、${rank+1}${rank+2}で${rank}・${rank+3}待ち）のどちらもこの手では作っていないはずです。そのため${partners[0]}・${partners[1]}のどちらも比較的安全とされる「スジ」になります。ただし単騎・シャンポン・カンチャン待ちには通用しないので「絶対安全」ではありません（絶対安全なのは現物だけ）`;
  } else {
    const partner = partners[0];
    const lo = Math.min(rank,partner), hi = Math.max(rank,partner);
    note = `豆知識：${rank}を切っているということは、${lo+1}${lo+2}（同じ種類の数牌）で${lo}・${hi}待ちの両面をこの手では作っていないはずです。そのため反対側の${partner}も比較的安全とされる「スジ」になります。ただし単騎・シャンポン・カンチャン待ちには通用しないので「絶対安全」ではありません（絶対安全なのは現物だけ）`;
  }

  return {
    stage:9,
    tileClick:true,
    question: partners.length===2
      ? "この捨て牌からできる「スジ」はどれ？両方とも選んでクリックしよう（両面待ちに対して比較的安全とされる牌）"
      : "この捨て牌からできる「スジ」はどれ？（両面待ちに対して比較的安全とされる牌をクリックして選ぼう）",
    contextHtml: discardsHtml,
    tiles: items,
    note,
    goodHint:"（その牌はこの捨て牌とスジの関係にありません）",
  };
}
// 壁：ある数字の牌が場に4枚すべて見えていると、その牌はもう山にも他家の手にも残っていない、という考え方。
// 待ちの種類にかかわらず「その牌そのもの」が誰の上がり牌にもなり得ないという、現物と同じくらい断定的な安全度を持つ。
function genKabeCheck(){
  let suit, rank, key;
  do{
    suit = pickSuit();
    rank = 1+Math.floor(Math.random()*9);
    key = "kabe|"+suit+rank;
  }while(isRecent(9,key));
  pushHistory(9,key);

  const wallTile = T(suit, rank);
  const wrongPool = TILES.filter(t=>!(t.suit===suit && t.rank===rank));
  const wrongTiles = pickN(wrongPool, 3);
  const items = shuffle([
    {t:wallTile, role:"floaterBad"},
    ...wrongTiles.map(t=>({t, role:"floaterGood"})),
  ]);

  const wallHtml = `<div class="hint" style="margin-bottom:6px;">場に見えている牌（自分の手牌＋みんなの捨て牌・鳴きなど）</div><div class="tiles-row" style="margin-bottom:14px;">${renderTile(wallTile)}${renderTile(wallTile)}${renderTile(wallTile)}${renderTile(wallTile)}</div>`;

  return {
    stage:9,
    tileClick:true,
    question:"この牌がすでに4枚とも見えています（壁）。この状況で、絶対に誰の上がり牌にもならない牌はどれ？",
    contextHtml: wallHtml,
    tiles: items,
    note:`豆知識：${rank}はすでに4枚とも見えているため、山にも他家の手にも1枚も残っていません。これを「壁」と言います。待ちの形が両面でもカンチャンでも単騎でも関係なく、${rank}そのもので誰かが上がることは絶対にありません`,
    goodHint:"（その牌はまだ4枚見えているわけではないので、壁としては安全と断定できません）",
  };
}
// 押し引き：教科書的にほぼ異論のない基本ケースだけを扱う（実戦の押し引きは点差・巡目なども絡む高度な判断のため、
// このアプリでは「聴牌の有無」「自分の手の強さ」「周りのリーチ」「安全牌の有無」による最も基本的な指針にとどめる）
const OSHI_HIKI_SCENARIOS = [
  { situation:"自分はまだ聴牌していません。上家がリーチを宣言しました。手元には安全牌（現物）があります。",
    correct:"降りる", reason:"聴牌していない状態では上がれる見込みが薄いのに、無理に危険な牌を切ると放銃のリスクだけを背負うことになります。安全牌があるなら、まずは安全に進めるのが基本です。" },
  { situation:"自分は聴牌していて、リーチ＋ドラ2の強い手です。誰もリーチしていません。",
    correct:"攻める", reason:"自分が聴牌していて手も強く、周りにリーチもない状況なら、積極的に攻めて和了を目指すのが基本です。" },
  { situation:"自分はまだ聴牌していません。誰もリーチしておらず、鳴きも出ていない序盤です。",
    correct:"攻める", reason:"まだ誰も上がりに近づいている様子がない序盤なら、危険を気にしすぎず自分の手を育てることを優先するのが基本です。" },
  { situation:"自分は聴牌していますが役はまだついていません。対面がリーチを宣言し、あなたには安全牌がありません。",
    correct:"攻める", reason:"安全牌が無ければ、降りたくても安全には降りられません。役がなくても聴牌しているなら、自分の待ち牌を切り続けて上がりを目指す（＝勝負を続ける）のが現実的な基本方針です。" },
  { situation:"自分はまだ聴牌していません。すでに2人がリーチを宣言しています。手元には安全牌があります。",
    correct:"降りる", reason:"リーチしている人が複数いると、放銃のリスクがそれだけ跳ね上がります。自分が聴牌もしていない状況なら、無理をせず安全に進めるのが基本です。" },
  { situation:"自分は聴牌していて役も2〜3翻ほどついています。誰もリーチしておらず、鳴きも出ていません。",
    correct:"攻める", reason:"聴牌していて役もある状態で、周りに危険な気配もないなら、素直に和了を目指すのが基本です。" },
  { situation:"自分はまだ聴牌していません。手元に安全牌が1枚もありません。上家がリーチを宣言しました。",
    correct:"攻める", reason:"安全牌が1枚もなければ、そもそも安全に降りる手段がありません。この場合は仕方なく、少しでもテンパイに近づく牌を切って手を進めるしかありません。" },
  { situation:"自分はすでにリーチを宣言しています。そのあとで対面もリーチを宣言しました。",
    correct:"攻める", reason:"リーチを宣言すると、それ以降は手牌を変えられず、ツモった牌をそのまま切る（手出しできない）というルール上の制約があります。つまりリーチした後は「降りる」という選択肢自体が存在せず、そのまま押すしかありません。" },
];
function genOshiHikiCheck(){
  let idx, key;
  do{
    idx = Math.floor(Math.random()*OSHI_HIKI_SCENARIOS.length);
    key = "oshihiki|"+idx;
  }while(isRecent(9,key));
  pushHistory(9,key);
  const s = OSHI_HIKI_SCENARIOS[idx];
  const choices = shuffle(["攻める","降りる"]);
  return {
    stage:9,
    question:"次の状況、あなたの基本的な判断は？",
    render:`<div class="wait-note" style="margin:14px 0;">${s.situation}</div>`,
    choices,
    answer:s.correct,
    note:`豆知識：${s.reason}`,
  };
}
function genQ9(){
  const r = Math.random();
  if(r<0.4) return genSujiCheck();
  if(r<0.65) return genKabeCheck();
  return genOshiHikiCheck();
}

/* ==================== ステージ5: 総合ミックス ==================== */
function genQ5(){
  const gens=[genQ1,genQ2,genQ3,genQ4,genQ6,genQ7,genQ8,genQ9];
  const g = gens[Math.floor(Math.random()*gens.length)]();
  return {...g, stage:5};
}

const GENERATORS = {1:genQ1,2:genQ2,3:genQ3,4:genQ4,5:genQ5,6:genQ6,7:genQ7,8:genQ8,9:genQ9};
const QUESTIONS_PER_ROUND = 8;
const MASTER_MIN_ATTEMPTS = QUESTIONS_PER_ROUND; // このステージの習熟バッジに必要な最低挑戦数
const MASTER_RATE = 80; // 習熟バッジに必要な正答率(%)

/* ==================== ステージ進行 ==================== */
function startStage(stageId){
  go("quiz", {
    stageId,
    qIndex:0,
    correctCount:0,
    current: GENERATORS[stageId](),
    answered:false,
  });
}
// 苦手復習モード：間違えた問題（実データ）をそのまま出題し、正解すると一覧から消える
function startReview(){
  const queue = [...(progress.missed||[])];
  if(queue.length===0) return;
  go("quiz", {
    stageId:"review",
    reviewQueue: queue,
    qIndex:0,
    correctCount:0,
    current: queue[0],
    answered:false,
  });
}
function roundTotal(s){
  return s.stageId==="review" ? (s.reviewQueue?s.reviewQueue.length:0) : QUESTIONS_PER_ROUND;
}
function addMissed(question){
  if(!progress.missed) progress.missed=[];
  progress.missed.push(question);
  if(progress.missed.length>30) progress.missed.shift();
}
function removeCurrentFromMissed(){
  if(state.stageId!=="review") return;
  const idx = progress.missed.indexOf(state.reviewQueue[state.qIndex]);
  if(idx!==-1) progress.missed.splice(idx,1);
}

function renderTileClickArea(items){
  return `<div class="tiles-row" id="tileClickArea">${items.map((it,i)=>`<button class="tile-choice-btn" data-idx="${i}">${renderTile(it.t,"small")}</button>`).join("")}</div>`;
}
function renderQuiz(){
  const s = state;
  const def = s.stageId==="review" ? {title:"🔁 苦手復習"} : STAGE_DEF.find(d=>d.id===s.stageId);
  const total = roundTotal(s);
  const pct = total ? Math.round((s.qIndex)/total*100) : 0;
  const isMulti = !!s.current.multi;
  const isTileClick = !!s.current.tileClick;
  app.innerHTML = `
    <div class="card">
      <div class="quiz-topbar"><button class="quit-btn" id="quitBtn">✕ やめる</button></div>
      <div class="sub-text">${def.title}　第${s.qIndex+1}問 / ${total}</div>
      <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
      <div class="question-text">${s.current.question}</div>
      ${isTileClick ? (s.current.contextHtml||"") : ""}
      ${isTileClick ? renderTileClickArea(s.current.tiles) : s.current.render}
      ${isTileClick ? "" : '<div class="choices" id="choices"></div>'}
      ${isMulti ? '<div class="btn-row"><button class="btn" id="submitMultiBtn">この内容で決定</button></div>' : ''}
      <div class="feedback" id="feedback"></div>
    </div>
  `;
  const quitBtn = document.getElementById("quitBtn");
  let quitTimer = null;
  quitBtn.onclick=()=>{
    if(!quitBtn.classList.contains("armed")){
      quitBtn.classList.add("armed");
      quitBtn.textContent = "本当にやめる？(もう一度押す)";
      quitTimer = setTimeout(()=>{
        quitBtn.classList.remove("armed");
        quitBtn.textContent = "✕ やめる";
      }, 3000);
    } else {
      clearTimeout(quitTimer);
      go("home");
    }
  };

  if(isTileClick){
    document.querySelectorAll(".tile-choice-btn").forEach(b=>{
      b.onclick = ()=>answerTileClick(parseInt(b.dataset.idx,10));
    });
    return;
  }

  const choicesEl = document.getElementById("choices");
  const opts = isMulti ? s.current.options : s.current.choices;
  opts.forEach(choice=>{
    const b=document.createElement("button");
    b.className="choice-btn"+(isMulti?" multi":"");
    b.dataset.value=choice;
    b.innerHTML=displayHtml(choice);
    b.onclick = isMulti ? ()=>toggleMultiChoice(b) : ()=>answerQuiz(choice,b);
    choicesEl.appendChild(b);
  });
  if(isMulti){
    document.getElementById("submitMultiBtn").onclick=()=>answerMultiQuiz();
  }
}

function toggleMultiChoice(btn){
  if(state.answered) return;
  btn.classList.toggle("selected");
}

function answerTileClick(idx){
  if(state.answered) return;
  state.answered = true;
  const items = state.current.tiles;
  const clickedRole = items[idx].role;
  // 正解は role==="floaterBad" の牌すべて（1つとは限らない。例：筋が2枚あるケースなど）
  const isCorrect = clickedRole==="floaterBad";

  const allBtns = document.querySelectorAll(".tile-choice-btn");
  allBtns.forEach((b,i)=>{
    b.disabled=true;
    if(items[i].role==="floaterBad") b.classList.add("correct");
    else if(i===idx) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  progress.total++;
  const st = progress.stageStats[state.stageId];
  if(st) st.t++;
  pushRecent(isCorrect);
  const noteHtml = state.current.note ? `<div class="wait-note">${state.current.note}</div>` : "";
  const feedback = document.getElementById("feedback");
  if(isCorrect){
    progress.correct++;
    if(st) st.c++;
    state.correctCount++;
    progress.xp += 10;
    removeCurrentFromMissed();
    feedback.innerHTML = "○ 正解！ +10XP" + noteHtml;
    feedback.className = "feedback ok";
  } else {
    const hint = clickedRole==="floaterGood"
      ? state.current.goodHint
      : "（その牌はまだ面子・対子・塔子の一部として使えます）";
    if(state.stageId!=="review") addMissed(state.current);
    feedback.innerHTML = `× 不正解…${hint}` + noteHtml;
    feedback.className = "feedback ng";
  }
  saveProgress();
  updateLevelBadge();

  showNextButton();
}

function advanceOrFinish(){
  const total = roundTotal(state);
  if(state.qIndex+1 >= total){
    finishStage();
  }else{
    state.qIndex++;
    state.current = state.stageId==="review" ? state.reviewQueue[state.qIndex] : GENERATORS[state.stageId]();
    state.answered = false;
    render();
  }
}

// 回答後は自動で進めず、解説をじっくり読めるよう「次の問題へ」ボタンで進む
function showNextButton(){
  const bar = document.createElement("div");
  bar.className = "next-fixed-bar";
  bar.id = "nextFixedBar";
  bar.innerHTML = `<button class="btn" id="nextQBtn">次へ ›</button>`;
  document.body.appendChild(bar);
  document.body.classList.add("has-next-bar");
  document.getElementById("nextQBtn").onclick = advanceOrFinish;
}

function answerMultiQuiz(){
  if(state.answered) return;
  state.answered = true;
  const allBtns = [...document.querySelectorAll(".choice-btn.multi")];
  const selected = allBtns.filter(b=>b.classList.contains("selected")).map(b=>b.dataset.value);
  const correctSet = state.current.correctSet;
  const selSet = new Set(selected);
  const corSet = new Set(correctSet);
  const isMatch = selSet.size===corSet.size && [...selSet].every(v=>corSet.has(v));

  allBtns.forEach(b=>{
    b.disabled=true;
    const val=b.dataset.value;
    if(corSet.has(val) && selSet.has(val)) b.classList.add("correct");
    else if(corSet.has(val) && !selSet.has(val)) b.classList.add("missed");
    else if(!corSet.has(val) && selSet.has(val)) b.classList.add("wrong");
  });
  const submitBtn=document.getElementById("submitMultiBtn");
  if(submitBtn) submitBtn.disabled=true;

  progress.total++;
  const st = progress.stageStats[state.stageId];
  if(st) st.t++;
  pushRecent(isMatch);
  const feedback = document.getElementById("feedback");
  const correctLabel = correctSet.map(c=>displayHtml(c)).join("」「");
  const scoreHtml = state.current.scoreInfo
    ? `<div class="hint">${state.current.scoreInfo.text}</div>` + (state.current.scoreInfo.fuBreakdown ? `<div class="hint" style="opacity:.6;">${state.current.scoreInfo.fuBreakdown}</div>` : "")
    : "";
  if(isMatch){
    progress.correct++;
    if(st) st.c++;
    state.correctCount++;
    progress.xp += 10;
    removeCurrentFromMissed();
    feedback.innerHTML = "○ 正解！ +10XP" + scoreHtml;
    feedback.className = "feedback ok";
  } else {
    if(state.stageId!=="review") addMissed(state.current);
    feedback.innerHTML = `× 不正解… 正解は「${correctLabel}」` + scoreHtml;
    feedback.className = "feedback ng";
  }
  saveProgress();
  updateLevelBadge();

  showNextButton();
}

function answerQuiz(choice, btnEl){
  if(state.answered) return;
  state.answered = true;
  const correct = choice === state.current.answer;
  const feedback = document.getElementById("feedback");
  const allBtns = document.querySelectorAll(".choice-btn");
  allBtns.forEach(b=>{
    b.disabled=true;
    if(b.dataset.value===state.current.answer) b.classList.add("correct");
    else if(b===btnEl) b.classList.add("wrong");
  });

  progress.total++;
  const st = progress.stageStats[state.stageId];
  if(st) st.t++;
  pushRecent(correct);
  const noteHtml = state.current.note ? `<div class="wait-note">${state.current.note}</div>` : "";
  if(correct){
    progress.correct++;
    if(st) st.c++;
    state.correctCount++;
    progress.xp += 10;
    removeCurrentFromMissed();
    feedback.innerHTML = "○ 正解！ +10XP" + noteHtml;
    feedback.className = "feedback ok";
  } else {
    if(state.stageId!=="review") addMissed(state.current);
    feedback.innerHTML = `× 不正解… 正解は「${displayHtml(state.current.answer)}」` + noteHtml;
    feedback.className = "feedback ng";
  }
  saveProgress();
  updateLevelBadge();

  showNextButton();
}

function finishStage(){
  const before = levelInfo(progress.xp - state.correctCount*10 + (progress.total? 0:0));
  // レベルアップ判定のため、開始前XPを概算(このラウンドで得たXPを引く)
  const gained = state.correctCount*10;
  const beforeXp = progress.xp - gained;
  const beforeLv = levelInfo(beforeXp).cur.lv;
  const afterLv = levelInfo(progress.xp).cur.lv;
  const leveledUp = afterLv > beforeLv;

  go("result", {
    stageId: state.stageId,
    correctCount: state.correctCount,
    gained,
    leveledUp,
    newLevel: levelInfo(progress.xp).cur,
  });
}

function renderResult(){
  const s = state;
  const total = roundTotal(s) || 1;
  const rate = Math.round(s.correctCount/total*100);
  const isReview = s.stageId==="review";
  const def = isReview ? {title:"🔁 苦手復習"} : STAGE_DEF.find(d=>d.id===s.stageId);
  let comment;
  if(rate>=90) comment="完璧！もう感覚で分かってますね";
  else if(rate>=70) comment="かなり定着してきています";
  else if(rate>=50) comment="半分以上正解！あと少し";
  else comment="繰り返すほど覚えます。もう一度挑戦してみましょう";
  const remaining = isReview ? (progress.missed||[]).length : null;

  app.innerHTML = `
    <div class="card">
      <div class="result-title">${def.title}　結果</div>
      <div class="result-sub">${s.correctCount} / ${total} 問正解（正答率 ${rate}%）</div>
      <div class="stat-row">
        <div><b>+${s.gained}</b>獲得XP</div>
        <div><b>${progress.xp}</b>累計XP</div>
      </div>
      ${s.leveledUp?`<div class="levelup-banner">🎉 レベルアップ！ Lv.${s.newLevel.lv}「${s.newLevel.name}」になりました</div>`:""}
      ${isReview?`<div class="hint">残りの苦手：${remaining}問</div>`:""}
      <div class="hint">${comment}</div>
      <div class="btn-row">
        ${isReview
          ? (remaining>0 ? '<button class="btn" id="retryBtn">続けて復習する</button>' : '')
          : '<button class="btn" id="retryBtn">もう一度挑戦</button>'}
        <button class="btn ghost" id="homeBtn">ステージ選択へ</button>
      </div>
    </div>
  `;
  const retryBtn = document.getElementById("retryBtn");
  if(retryBtn) retryBtn.onclick = isReview ? ()=>startReview() : ()=>startStage(s.stageId);
  document.getElementById("homeBtn").onclick=()=>go("home");
}

/* ==================== ルーター ==================== */
function render(){
  document.body.classList.remove("has-next-bar");
  const oldBar = document.getElementById("nextFixedBar");
  if(oldBar) oldBar.remove();
  if(state.screen==="home") renderHome();
  else if(state.screen==="quiz") renderQuiz();
  else if(state.screen==="result") renderResult();
  else if(state.screen==="nameEntry" || state.screen==="userSwitch") renderNameEntry();
  else if(state.screen==="yakuTable") renderYakuTable();
  else if(state.screen==="tutorial") renderTutorial();
  else if(state.screen==="flowDemo") renderFlowDemo();
  else if(state.screen==="scoreCalc") renderScoreCalc();
}
function startFlowDemo(){
  go("flowDemo", {demoIndex:0});
}

render();
</script>
